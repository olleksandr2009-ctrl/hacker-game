<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>AgroCraft: Mobile & PC</title>
    <style>
        body { margin: 0; background: #87ceeb; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }

        /* Джойстик для мобільних */
        .joystick-zone { position: fixed; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; z-index: 10; }
        .joystick-stick { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: #fff; border-radius: 50%; opacity: 0.5; }

        /* Інвентар */
        .inventory { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; }
        .slot { width: 40px; height: 40px; background: #8b8b8b; border: 2px solid #555; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .slot.active { border-color: #fff; background: #aaa; }

        .hud { position: fixed; top: 10px; left: 10px; pointer-events: none; background: rgba(0,0,0,0.3); padding: 5px; }
    </style>
</head>
<body>

<div class="hud">Керування: WASD або Джойстик<br>ЛКМ - Ставити, ПКМ - Ламати</div>

<div class="joystick-zone" id="joy-zone">
    <div class="joystick-stick" id="joy-stick"></div>
</div>

<div class="inventory">
    <div class="slot active" onclick="sel(1, this)">🟫</div>
    <div class="slot" onclick="sel(2, this)">🧱</div>
    <div class="slot" onclick="sel(3, this)">🌿</div>
    <div class="slot" onclick="sel(4, this)">💎</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

const TILE = 40;
let world = {};
let player = { x: 0, y: 0, speed: 4, block: 1 };
let cam = { x: 0, y: 0 };
let keys = {};
let joy = { dx: 0, dy: 0, active: false };

// Початковий світ
for(let x = -10; x < 10; x++) {
    for(let y = 2; y < 6; y++) {
        world[`${x},${y}`] = (y === 2) ? 3 : 1;
    }
}

function update() {
    // Рух клавіатурою
    if (keys['w'] || keys['ц']) player.y -= player.speed;
    if (keys['s'] || keys['і']) player.y += player.speed;
    if (keys['a'] || keys['ф']) player.x -= player.speed;
    if (keys['d'] || keys['в']) player.x += player.speed;

    // Рух джойстиком
    player.x += joy.dx * player.speed;
    player.y += joy.dy * player.speed;

    // Слідування камери
    cam.x += (player.x - cam.x - W/2) * 0.1;
    cam.y += (player.y - cam.y - H/2) * 0.1;
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(-cam.x, -cam.y);

    // Блоки
    for(let key in world) {
        let [x, y] = key.split(',').map(Number);
        ctx.fillStyle = {1:'#5d4037', 2:'#7f8c8d', 3:'#2ecc71', 4:'#00d2ff'}[world[key]];
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        ctx.strokeStyle = "rgba(0,0,0,0.1)";
        ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
    }

    // Персонаж
    ctx.fillStyle = "#e0ac69"; 
    ctx.fillRect(player.x - 15, player.y - 40, 30, 30); // Голова
    ctx.fillStyle = "#00f"; 
    ctx.fillRect(player.x - 15, player.y - 10, 30, 40); // Тіло

    ctx.restore();
    update();
    requestAnimationFrame(draw);
}

// Події клавіатури
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Будування
canvas.onmousedown = e => {
    let gx = Math.floor((e.clientX + cam.x) / TILE);
    let gy = Math.floor((e.clientY + cam.y) / TILE);
    if(e.button === 0) world[`${gx},${gy}`] = player.block;
    else delete world[`${gx},${gy}`];
};
canvas.oncontextmenu = e => e.preventDefault();

// Логіка джойстика
const joyZone = document.getElementById('joy-zone');
const joyStick = document.getElementById('joy-stick');

joyZone.ontouchstart = () => joy.active = true;
window.ontouchmove = e => {
    if(!joy.active) return;
    let rect = joyZone.getBoundingClientRect();
    let touch = e.touches[0];
    let x = touch.clientX - (rect.left + 50);
    let y = touch.clientY - (rect.top + 50);
    let dist = Math.sqrt(x*x + y*y);
    let max = 40;
    if(dist > max) { x *= max/dist; y *= max/dist; }
    joyStick.style.transform = `translate(${x}px, ${y}px)`;
    joy.dx = x/max; joy.dy = y/max;
};
window.ontouchend = () => {
    joy.active = false; joy.dx = 0; joy.dy = 0;
    joyStick.style.transform = `translate(0, 0)`;
};

function sel(id, el) {
    player.block = id;
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
}

draw();
</script>
</body>
</html>
