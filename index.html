<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0b0b; color: white; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 25px 0; }
        .balance-label { font-size: 12px; color: #777; text-transform: uppercase; }
        .balance-val { font-size: 40px; font-weight: 800; color: #ffad00; }
        
        .prog-card { background: #161616; border-radius: 18px; padding: 18px; margin-bottom: 25px; border: 1px solid #222; }
        .bar-bg { background: #333; border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
        .bar-fill { background: #ffad00; height: 100%; width: 0%; transition: 0.6s; }

        .card { background: #161616; border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .reward { color: #00c853; font-weight: bold; font-size: 13px; }
        
        .btn { background: #ffad00; color: #000; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; }
        
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; border-top: 1px solid #222; padding-bottom: 15px; }
        .nav-item { flex: 1; text-align: center; padding: 15px; color: #555; font-size: 12px; font-weight: bold; }
        .nav-item.active { color: #ffad00; border-top: 2px solid #ffad00; }
        #withdraw-page { display: none; text-align: center; padding-top: 50px; }
    </style>
</head>
<body>
    <div id="earn-page">
        <div class="header">
            <div class="balance-label">Your Balance</div>
            <div class="balance-val"><span id="stars">0.0</span> ⭐</div>
        </div>

        <div class="prog-card">
            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                <span>Progress</span> <span id="perc">0%</span>
            </div>
            <div class="bar-bg"><div id="fill" class="bar-fill"></div></div>
        </div>

        <h3 style="margin-left: 5px;">Active Tasks</h3>
        <div id="list"></div>
    </div>

    <div id="withdraw-page">
        <h2 style="color: #ffad00;">Withdrawal</h2>
        <p>Minimum 15.0 Stars required.</p>
        <button class="btn" style="width: 80%; margin-top: 20px;" onclick="payout()">Request Payout</button>
    </div>

    <div class="nav">
        <div class="nav-item active" id="te" onclick="tab('earn')">EARN</div>
        <div class="nav-item" id="tw" onclick="tab('withdraw')">WITHDRAW</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Отримуємо дані з посилання (URL)
        const params = new URLSearchParams(window.location.search);
        const stars = parseFloat(params.get('stars')) || 0.0;
        const channelsData = params.get('channels');

        // 2. Оновлюємо інтерфейс
        document.getElementById('stars').innerText = stars.toFixed(1);
        let p = Math.min((stars / 15) * 100, 100);
        document.getElementById('fill').style.width = p + "%";
        document.getElementById('perc').innerText = Math.floor(p) + "%";

        const list = document.getElementById('list');
        if (channelsData) {
            channelsData.split(',').forEach(ch => {
                let [name, link] = ch.split('|');
                list.innerHTML += `
                    <div class="card">
                        <div><b>${name}</b><br><span class="reward">+0.3 Stars</span></div>
                        <button class="btn" onclick="doSub('${link}', '${name}')">JOIN</button>
                    </div>`;
            });
        } else {
            list.innerHTML = "<p style='text-align:center;color:#444;'>No tasks yet.</p>";
        }

        function tab(t) {
            document.getElementById('earn-page').style.display = t=='earn'?'block':'none';
            document.getElementById('withdraw-page').style.display = t=='withdraw'?'block':'none';
            document.getElementById('te').classList.toggle('active', t=='earn');
            document.getElementById('tw').classList.toggle('active', t=='withdraw');
        }

        function doSub(url, name) {
            tg.openTelegramLink(url);
            tg.sendData("check:" + name);
        }

        function payout() {
            if(stars < 15) tg.showAlert("Need 15.0 Stars!");
            else tg.sendData("withdraw");
        }
    </script>
</body>
</html>
