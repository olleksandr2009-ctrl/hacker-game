<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D AgroCraft JS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid white; transform: translate(-50%, -50%); pointer-events: none;
        }
        #ui {
            position: absolute; bottom: 20px; left: 20px; color: white;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="crosshair"></div>
<div id="ui">ЛКМ - Ламати | ПКМ - Ставити | WASD - Рух</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// --- НАЛАШТУВАННЯ СЦЕНИ ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Світло
const light = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(light);
const sun = new THREE.DirectionalLight(0xffffff, 0.5);
sun.position.set(5, 10, 7.5);
scene.add(sun);

// --- ГРАВЕЦЬ ТА УПРАВЛІННЯ ---
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();

document.addEventListener('click', () => document.body.requestPointerLock());

const onKeyDown = (e) => {
    switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyD': moveRight = true; break;
        case 'Space': if (canJump) velocity.y += 5; canJump = false; break;
    }
};
const onKeyUp = (e) => {
    switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyD': moveRight = false; break;
    }
};
document.addEventListener('keydown', onKeyDown);
document.addEventListener('keyup', onKeyUp);

// Огляд мишкою
let pitch = 0, yaw = 0;
document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
    }
});

// --- СВІТ (БЛОКИ) ---
const geometry = new THREE.BoxGeometry(1, 1, 1);
const material = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
const blocks = [];

function createBlock(x, y, z, mat = material) {
    const cube = new THREE.Mesh(geometry, mat);
    cube.position.set(x, y, z);
    scene.add(cube);
    blocks.push(cube);
}

// Генерація підлоги
for(let x = -10; x < 10; x++) {
    for(let z = -10; z < 10; z++) {
        createBlock(x, 0, z, (Math.random() > 0.1 ? material : dirtMaterial));
    }
}

// --- ВЗАЄМОДІЯ (ЛАМАННЯ/БУДУВАННЯ) ---
const raycaster = new THREE.Raycaster();
document.addEventListener('mousedown', (e) => {
    if (document.pointerLockElement !== document.body) return;

    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects(blocks);

    if (intersects.length > 0) {
        const intersect = intersects[0];
        
        if (e.button === 0) { // ЛКМ - Видалити
            scene.remove(intersect.object);
            blocks.splice(blocks.indexOf(intersect.object), 1);
        } else if (e.button === 2) { // ПКМ - Поставити
            const pos = intersect.object.position.clone().add(intersect.face.normal);
            createBlock(pos.x, pos.y, pos.z);
        }
    }
});
window.addEventListener('contextmenu', e => e.preventDefault());

// --- ЦИКЛ ГРИ ---
camera.position.y = 2;
let prevTime = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const time = performance.now();
    const delta = (time - prevTime) / 1000;

    if (document.pointerLockElement === document.body) {
        // Фізика руху
        velocity.y -= 9.8 * delta; // Гравітація
        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        camera.position.y += velocity.y * delta;

        if (camera.position.y < 2) {
            velocity.y = 0;
            camera.position.y = 2;
            canJump = true;
        }
        velocity.x *= 0.9;
        velocity.z *= 0.9;
    }

    renderer.render(scene, camera);
    prevTime = time;
}

animate();
</script>
</body>
</html>
