<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f0f0f; color: #ffffff; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 30px 0; }
        .balance-title { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 42px; font-weight: 800; color: #ffad00; margin: 5px 0; }
        
        .progress-card { background: #1a1a1a; border-radius: 20px; padding: 20px; margin-bottom: 25px; border: 1px solid #333; }
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .bar-bg { background: #333; border-radius: 10px; height: 12px; overflow: hidden; }
        .bar-fill { background: linear-gradient(90deg, #ffad00, #ff8800); height: 100%; width: 0%; transition: 0.5s; }

        .list-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; padding-left: 5px; }
        .card { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a2a; }
        .card-name { font-weight: 600; font-size: 16px; display: block; }
        .card-sub { color: #00c853; font-size: 13px; font-weight: 700; margin-top: 4px; display: block; }
        
        .btn-sub { background: #ffad00; color: #000; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
        
        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background: #121212; display: flex; border-top: 1px solid #222; padding-bottom: 20px; }
        .nav-item { flex: 1; text-align: center; padding: 15px; color: #666; font-weight: 700; font-size: 12px; }
        .nav-item.active { color: #ffad00; border-top: 2px solid #ffad00; }
        
        #withdraw-section { display: none; text-align: center; padding-top: 40px; }
        .empty-msg { text-align: center; color: #555; margin-top: 40px; }
    </style>
</head>
<body>
    <div id="earn-section">
        <div class="header">
            <div class="balance-title">Current Balance</div>
            <div class="balance-value"><span id="stars-val">0.0</span> <small style="font-size: 20px;">⭐</small></div>
        </div>

        <div class="progress-card">
            <div class="progress-header">
                <span>Payout Progress</span>
                <span id="perc-val">0%</span>
            </div>
            <div class="bar-bg"><div id="bar" class="bar-fill"></div></div>
            <div style="font-size: 11px; color: #555; margin-top: 8px;">Target: 15.0 Stars</div>
        </div>

        <div class="list-title">Available Tasks</div>
        <div id="tasks-list"></div>
    </div>

    <div id="withdraw-section">
        <h2 style="color: #ffad00;">Withdrawal</h2>
        <p style="color: #888;">Minimum amount to withdraw is 15 Stars.</p>
        <button class="btn-sub" style="width: 80%; margin-top: 30px; padding: 15px;" onclick="requestPayout()">Withdraw Funds</button>
    </div>

    <div class="navbar">
        <div class="nav-item active" id="tab-e" onclick="switchTab('earn')">EARN</div>
        <div class="nav-item" id="tab-w" onclick="switchTab('withdraw')">WITHDRAW</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0f0f0f';

        // Отримання даних з URL (переданих ботом)
        const urlParams = new URLSearchParams(window.location.search);
        const userStars = parseFloat(urlParams.get('stars')) || 0.0;
        const rawChannels = urlParams.get('channels'); // Формат: name|link,name|link
        
        function init() {
            document.getElementById('stars-val').innerText = userStars.toFixed(1);
            let p = Math.min((userStars / 15) * 100, 100);
            document.getElementById('bar').style.width = p + "%";
            document.getElementById('perc-val').innerText = Math.floor(p) + "%";

            const list = document.getElementById('tasks-list');
            if (rawChannels) {
                rawChannels.split(',').forEach(item => {
                    let [username, link] = item.split('|');
                    list.innerHTML += `
                        <div class="card">
                            <div><span class="card-name">${username}</span><span class="card-sub">+0.3 STARS</span></div>
                            <button class="btn-sub" onclick="doTask('${link}', '${username}')">JOIN</button>
                        </div>`;
                });
            } else {
                list.innerHTML = '<div class="empty-msg">No tasks available right now.</div>';
            }
        }

        function switchTab(t) {
            document.getElementById('earn-section').style.display = t === 'earn' ? 'block' : 'none';
            document.getElementById('withdraw-section').style.display = t === 'withdraw' ? 'block' : 'none';
            document.getElementById('tab-e').classList.toggle('active', t === 'earn');
            document.getElementById('tab-w').classList.toggle('active', t === 'withdraw');
        }

        function doTask(url, username) {
            tg.openTelegramLink(url);
            tg.sendData("check:" + username);
        }

        function requestPayout() {
            if(userStars < 15) tg.showAlert("Insufficient balance!");
            else tg.sendData("withdraw");
        }

        init();
    </script>
</body>
</html>
