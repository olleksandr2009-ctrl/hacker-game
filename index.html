<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Agro Tycoon PRO</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#48dbfb;--gold:#f1c40f;--green:#4cd137;--red:#e84118;--gray:#555;}
body{background:var(--bg);margin:0;font-family:sans-serif;color:white;overflow:hidden;user-select:none;}
.header{background:var(--card);padding:10px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;}
.lvl-container{flex:1;margin:0 15px;text-align:center;}
.xp-bar{width:100%;height:8px;background:#0f3460;border-radius:4px;margin-top:4px;overflow:hidden;}
.xp-fill{width:0%;height:100%;background:var(--green);transition:width 0.3s;}
.screen{display:none;height:80vh;overflow-y:auto;padding:15px;box-sizing:border-box;padding-bottom:100px;}
.active-screen{display:block;}
.farm-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.plot{height:100px;background:#5d4037;border:3px solid #3e2723;border-radius:15px;display:flex;align-items:center;justify-content:center;position:relative;}
.card{background:var(--card);padding:12px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;border:1px solid #0f3460;}
.card.locked{opacity:0.6;filter:grayscale(1);}
.lock-tag{background:var(--red);font-size:10px;padding:2px 5px;border-radius:4px;}
.buy-btn{background:var(--accent);border:none;color:#1a1a2e;padding:8px 12px;border-radius:6px;font-weight:bold;}
.footer{position:fixed;bottom:0;width:100%;display:flex;background:var(--card);padding:10px 0;border-top:2px solid #0f3460;}
.nav-btn{flex:1;background:none;border:none;color:#95a5a6;display:flex;flex-direction:column;align-items:center;font-size:10px;}
.nav-btn.active{color:var(--accent);}
</style></head><body onload="init()">

<div class="header">
    <div style="font-size:14px;color:var(--gold)">💰 <span id="balance">0.0</span></div>
    <div class="lvl-container">
        <div style="font-size:12px;font-weight:bold;">LVL <span id="lvl">1</span></div>
        <div class="xp-bar"><div id="xp-fill" class="xp-fill"></div></div>
    </div>
    <div style="font-size:14px;color:var(--accent)">🌐 <span id="online">51</span></div>
</div>

<div id="farm-screen" class="screen active-screen">
    <div id="farm-grid" class="farm-grid"></div>
</div>

<div id="shop-screen" class="screen">
    <h3 style="color:var(--accent)">🛒 НАСІННЯ (МАКС LVL 10)</h3>
    <div id="seed-list"></div>
</div>

<div class="footer">
    <button class="nav-btn active" onclick="show('farm',this)">🚜 ФЕРМА</button>
    <button class="nav-btn" onclick="show('shop',this)">🛒 ШОП</button>
</div>

<script>
let tg = window.Telegram.WebApp; tg.expand();
let user = {
    balance: 15.0, lvl: 1, xp: 0, nextLvlXp: 100,
    inventory: {}, stats: {}, plots: [null, null, null, null]
};

const crops = [
    {emoji:"🌾", name:"Пшениця", price:0.5, time:10, lvl:1, xp:10},
    {emoji:"🥕", name:"Морква", price:1.2, time:30, lvl:2, xp:25},
    {emoji:"🍅", name:"Помідор", price:2.5, time:60, lvl:3, xp:50},
    {emoji:"🥔", name:"Картопля", price:5.0, time:120, lvl:5, xp:120},
    {emoji:"🌽", name:"Кукурудза", price:10.0, time:300, lvl:7, xp:300},
    {emoji:"🍓", name:"Полуниця", price:25.0, time:600, lvl:10, xp:800}
];

function init() {
    let saved = localStorage.getItem('agro_v15');
    if (saved) user = JSON.parse(saved);
    updateUI(); renderFarm();
    setInterval(updateOnline, 30000);
}

function updateUI() {
    document.getElementById('balance').innerText = user.balance.toFixed(1);
    document.getElementById('lvl').innerText = user.lvl;
    let progress = (user.xp / user.nextLvlXp) * 100;
    document.getElementById('xp-fill').style.width = Math.min(100, progress) + "%";
}

function addXp(amount) {
    if (user.lvl >= 10) return;
    user.xp += amount;
    if (user.xp >= user.nextLvlXp) {
        user.lvl++;
        user.xp = 0;
        user.nextLvlXp = Math.floor(user.nextLvlXp * 2.5); // Тяжка прокачка (х2.5 кожного разу)
        tg.showAlert("НОВИЙ РІВЕНЬ: " + user.lvl + "!");
    }
    updateUI();
}

function renderFarm() {
    let g = document.getElementById('farm-grid'); g.innerHTML = '';
    user.plots.forEach((p, i) => {
        let div = document.createElement('div'); div.className = 'plot';
        if (p) {
            let remain = Math.ceil((p.finish - Date.now())/1000);
            if (remain <= 0) {
                div.innerHTML = `<span style="font-size:40px">${p.emoji}</span><br><small>ГОТОВО</small>`;
            } else {
                div.innerHTML = `<span>🌱</span><br><small>${remain}s</small>`;
            }
        } else { div.innerHTML = "➕"; }
        div.onclick = () => handlePlot(i);
        g.appendChild(div);
    });
}

function handlePlot(i) {
    let p = user.plots[i];
    if (!p) {
        let seedEmoji = Object.keys(user.inventory).find(k => user.inventory[k] > 0);
        if (!seedEmoji) return tg.showAlert("Немає насіння!");
        let c = crops.find(x => x.emoji == seedEmoji);
        user.inventory[seedEmoji]--;
        user.plots[i] = {emoji: c.emoji, finish: Date.now() + (c.time * 1000), xp: c.xp};
        renderFarm();
        setTimeout(renderFarm, c.time * 1000);
    } else if (Date.now() >= p.finish) {
        addXp(p.xp);
        user.plots[i] = null;
        renderFarm();
    }
}

function renderShop() {
    let list = document.getElementById('seed-list'); list.innerHTML = '';
    crops.forEach(c => {
        let isLocked = user.lvl < c.lvl;
        let card = document.createElement('div');
        card.className = 'card' + (isLocked ? ' locked' : '');
        card.innerHTML = `
            <div>
                <b>${c.emoji} ${c.name}</b><br>
                <small>${isLocked ? '<span class="lock-tag">Відкриється на LVL '+c.lvl+'</span>' : 'Ціна: '+c.price+'💰'}</small>
            </div>
            ${isLocked ? '🔒' : `<button class="buy-btn" onclick="buySeed('${c.emoji}')">КУПИТИ</button>`}
        `;
        list.appendChild(card);
    });
}

function buySeed(emoji) {
    let c = crops.find(x => x.emoji == emoji);
    if (user.balance >= c.price) {
        user.balance -= c.price;
        user.inventory[emoji] = (user.inventory[emoji] || 0) + 1;
        updateUI(); renderShop();
    }
}

function show(s, btn) {
    document.querySelectorAll('.screen').forEach(x => x.classList.remove('active-screen'));
    document.getElementById(s + '-screen').classList.add('active-screen');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (s == 'shop') renderShop();
}

function updateOnline() {
    let count = parseInt(document.getElementById('online').innerText);
    document.getElementById('online').innerText = count + (Math.floor(Math.random()*5)-2);
    localStorage.setItem('agro_v15', JSON.stringify(user));
}
</script></body></html>
