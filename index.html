<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; margin: 0; padding: 15px; }
        .header { text-align: center; font-size: 28px; padding: 20px 0; color: #ffad00; font-weight: bold; }
        
        /* Шкала прогресу */
        .progress-box { background: #2d2d2d; border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid #444; }
        .progress-container { background: #444; border-radius: 10px; height: 12px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #ffad00, #ffd200); height: 100%; width: 0%; transition: width 0.5s ease; }
        .stats-text { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; }

        .card { background: #1e1e1e; border-radius: 15px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-info { flex-grow: 1; }
        .card-title { font-weight: bold; font-size: 16px; display: block; margin-bottom: 4px; }
        .card-reward { color: #00c853; font-size: 14px; font-weight: bold; }
        
        .btn { background: #ffad00; color: black; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e1e1e; display: flex; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; text-align: center; padding: 15px; color: #888; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: #ffad00; border-top: 3px solid #ffad00; }
        
        #withdraw-page { display: none; text-align: center; padding-top: 50px; }
    </style>
</head>
<body>
    <div id="earn-page">
        <div class="header">💎 <span id="balance">0.0</span> Stars</div>
        
        <div class="progress-box">
            <div class="stats-text">
                <span>Прогрес виводу</span>
                <span><span id="p-percent">0</span>%</span>
            </div>
            <div class="progress-container">
                <div id="p-bar" class="progress-bar"></div>
            </div>
            <div class="stats-text" style="font-size: 12px;">Ціль: 15.0 Stars</div>
        </div>

        <div id="list">
            <div class="card">
                <div class="card-info">
                    <span class="card-title">Paws & Tails 🐱</span>
                    <span class="card-reward">+0.4 Stars</span>
                </div>
                <button class="btn" onclick="sub('https://t.me/your_channel', '@your_channel')">Підписатись</button>
            </div>
        </div>
    </div>

    <div id="withdraw-page">
        <div class="header" style="color: #aaa;">💳 Виплата</div>
        <p>Ваш баланс: <span id="w-balance">0.0</span> Stars</p>
        <button class="btn" id="w-btn" style="width: 80%; margin-top: 20px;" onclick="withdraw()">Вивести</button>
    </div>

    <div class="nav">
        <div class="nav-item active" id="t-earn" onclick="tab('earn')">ЗАРОБИТИ</div>
        <div class="nav-item" id="t-draw" onclick="tab('withdraw')">ВИВЕСТИ</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let stars = 0.0; // Це має підтягуватись з бази бота

        function updateUI(val) {
            stars = val;
            document.getElementById('balance').innerText = stars.toFixed(1);
            document.getElementById('w-balance').innerText = stars.toFixed(1);
            let p = (stars / 15) * 100;
            document.getElementById('p-bar').style.width = Math.min(p, 100) + "%";
            document.getElementById('p-percent').innerText = Math.floor(Math.min(p, 100));
            
            if(stars >= 15) {
                document.getElementById('w-btn').style.background = "#00c853";
            }
        }

        function tab(n) {
            document.getElementById('earn-page').style.display = n=='earn'?'block':'none';
            document.getElementById('withdraw-page').style.display = n=='withdraw'?'block':'none';
            document.getElementById('t-earn').classList.toggle('active', n=='earn');
            document.getElementById('t-draw').classList.toggle('active', n=='withdraw');
        }

        function sub(url, id) {
            tg.openTelegramLink(url);
            tg.sendData("check:" + id); // Відправляє боту запит на перевірку
        }

        function withdraw() {
            if(stars < 15) {
                tg.showAlert("Треба мінімум 15 Stars!");
            } else {
                tg.sendData("withdraw");
            }
        }
        
        updateUI(0.0); // Початковий стан
    </script>
</body>
</html>
