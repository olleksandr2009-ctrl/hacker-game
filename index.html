<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>Brawl Farm: Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #1a1a2e; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: #27ae60; }
        
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; }
        .stats { padding: 10px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); }
        .hp-bar { width: 150px; height: 15px; background: #333; border: 2px solid white; border-radius: 10px; }
        #hp-fill { height: 100%; background: #e74c3c; width: 100%; transition: 0.2s; }
        
        .joystick-zone { position: fixed; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: all; }
        .stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: white; border-radius: 50%; opacity: 0.5; }
        
        .shoot-btn { position: fixed; bottom: 50px; right: 50px; width: 80px; height: 80px; background: #e67e22; border-radius: 50%; border: 4px solid #d35400; pointer-events: all; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 6px 0 #a04000; }
        .shoot-btn:active { transform: scale(0.9); box-shadow: 0 2px 0 #a04000; }
        
        #menu { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .btn { background: #f1c40f; color: black; padding: 15px 40px; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px; font-size: 20px; }
    </style>
</head>
<body>

<div id="menu">
    <h1>BRAWL FARM</h1>
    <p>Твій боєць: 🌽 Кукурудза-Месник</p>
    <button class="btn" onclick="startGame()">У БІЙ!</button>
</div>

<div class="ui-layer">
    <div class="stats">
        <div>HP: <div class="hp-bar"><div id="hp-fill"></div></div></div>
        <div id="score-display">KILLS: 0</div>
    </div>
</div>

<div class="joystick-zone" id="joy-zone"><div class="stick" id="stick"></div></div>
<div class="shoot-btn" onclick="playerShoot()">BRAWL!</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x: canvas.width/2, y: canvas.height/2, r: 20, hp: 100, maxHp: 100, speed: 4, score: 0 };
let bullets = [];
let enemies = [];
let gameActive = false;
let joy = { x: 0, y: 0, active: false };

function startGame() {
    document.getElementById('menu').style.display = 'none';
    player.hp = 100;
    player.score = 0;
    enemies = [];
    bullets = [];
    gameActive = true;
    spawnEnemy();
}

function spawnEnemy() {
    if(!gameActive) return;
    let side = Math.floor(Math.random() * 4);
    let x, y;
    if(side === 0) { x = Math.random()*canvas.width; y = -20; }
    else if(side === 1) { x = canvas.width+20; y = Math.random()*canvas.height; }
    else if(side === 2) { x = Math.random()*canvas.width; y = canvas.height+20; }
    else { x = -20; y = Math.random()*canvas.height; }
    
    enemies.push({ x, y, r: 18, hp: 2, speed: 1.5 + (player.score * 0.1) });
    setTimeout(spawnEnemy, Math.max(500, 2000 - player.score * 100));
}

function playerShoot() {
    if(!gameActive) return;
    // Стріляємо в найближчого ворога або вперед
    let angle = enemies.length > 0 ? Math.atan2(enemies[0].y - player.y, enemies[0].x - player.x) : -Math.PI/2;
    bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle)*8, vy: Math.sin(angle)*8 });
}

// Управління джойстиком
const joyZone = document.getElementById('joy-zone');
const stick = document.getElementById('stick');

joyZone.addEventListener('touchstart', e => { joy.active = true; });
joyZone.addEventListener('touchmove', e => {
    let rect = joyZone.getBoundingClientRect();
    let touch = e.touches[0];
    let dx = touch.clientX - (rect.left + 60);
    let dy = touch.clientY - (rect.top + 60);
    let dist = Math.sqrt(dx*dx + dy*dy);
    let max = 40;
    
    if(dist > max) { dx *= max/dist; dy *= max/dist; }
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    joy.x = dx/max;
    joy.y = dy/max;
});
joyZone.addEventListener('touchend', () => {
    joy.active = false;
    joy.x = 0; joy.y = 0;
    stick.style.transform = `translate(0, 0)`;
});

function update() {
    if(!gameActive) return;

    // Рух гравця
    player.x += joy.x * player.speed;
    player.y += joy.y * player.speed;

    // Межі екрану
    player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
    player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

    // Кулі
    bullets.forEach((b, index) => {
        b.x += b.vx; b.y += b.vy;
        if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(index, 1);
    });

    // Вороги
    enemies.forEach((en, eIdx) => {
        let angle = Math.atan2(player.y - en.y, player.x - en.x);
        en.x += Math.cos(angle) * en.speed;
        en.y += Math.sin(angle) * en.speed;

        // Колізія з кулями
        bullets.forEach((b, bIdx) => {
            let dist = Math.hypot(en.x - b.x, en.y - b.y);
            if(dist < en.r) {
                en.hp--;
                bullets.splice(bIdx, 1);
                if(en.hp <= 0) {
                    enemies.splice(eIdx, 1);
                    player.score++;
                    document.getElementById('score-display').innerText = `KILLS: ${player.score}`;
                }
            }
        });

        // Колізія з гравцем
        if(Math.hypot(en.x - player.x, en.y - player.y) < player.r + en.r) {
            player.hp -= 0.5;
            document.getElementById('hp-fill').style.width = player.hp + "%";
            if(player.hp <= 0) {
                gameActive = false;
                alert("ГРА ЗАКІНЧЕНА! Твій рахунок: " + player.score);
                location.reload();
            }
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Малюємо гравця (Corn Brawler)
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'black'; ctx.fillText("🌽", player.x-10, player.y+5);

    // Кулі (Попкорн)
    ctx.fillStyle = 'white';
    bullets.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
    });

    // Вороги (Злі бур'яни)
    ctx.fillStyle = '#8e44ad';
    enemies.forEach(en => {
        ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'white'; ctx.fillText("🌿", en.x-8, en.y+5);
        ctx.fillStyle = '#8e44ad';
    });

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
