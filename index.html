<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hacker Farm Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #34495e; margin: 0; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        
        /* Верхня панель */
        .header { background: #2c3e50; padding: 15px; display: flex; justify-content: space-between; border-bottom: 3px solid #f1c40f; }
        .coins { color: #f1c40f; font-weight: bold; font-size: 20px; }

        .screen { display: none; height: 78vh; overflow-y: auto; padding: 15px; box-sizing: border-box; }
        .active-screen { display: block; }

        /* ІЗОМЕТРИЧНІ ГРЯДКИ (ПІД НАХИЛОМ) */
        .farm-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; 
            margin-top: 30px; perspective: 800px; 
        }
        .plot { 
            height: 100px; background: #5d4037; border: 4px solid #3e2723; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; position: relative;
            transform: rotateX(40deg) rotateZ(0deg); 
            box-shadow: 0 10px 0 #261b18; transition: 0.2s;
        }
        .plot:active { transform: rotateX(40deg) scale(0.95); box-shadow: 0 4px 0 #261b18; }
        .plant { font-size: 50px; position: absolute; bottom: 10px; transition: 0.5s; transform: rotateX(-40deg); }

        /* Вкладки Магазину */
        .tabs { display: flex; margin-bottom: 15px; background: #2c3e50; border-radius: 10px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; border: none; color: white; background: none; font-weight: bold; opacity: 0.5; }
        .tab-btn.active { opacity: 1; background: #27ae60; }

        .card { background: #2c3e50; padding: 12px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .market-slot { background: #16a085; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid gold; }

        /* НИЖНІ КНОПКИ */
        .footer { position: fixed; bottom: 0; width: 100%; display: flex; background: #1a252f; padding: 10px 0; border-top: 2px solid #2c3e50; }
        .nav-btn { flex: 1; background: none; border: none; color: #7f8c8d; display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: bold; }
        .nav-btn.active { color: #f1c40f; }
        .nav-icon { font-size: 22px; margin-bottom: 3px; }
    </style>
</head>
<body>

<div class="header">
    <div class="coins">💰 <span id="balance">500</span></div>
    <div style="font-size: 12px;">Склад: <span id="storage-count">0</span></div>
</div>

<div id="farm-screen" class="screen active-screen">
    <div class="farm-grid">
        <div class="plot" onclick="farm(0)"><div class="plant" id="p0"></div></div>
        <div class="plot" onclick="farm(1)"><div class="plant" id="p1"></div></div>
        <div class="plot" onclick="farm(2)"><div class="plant" id="p2"></div></div>
        <div class="plot" onclick="farm(3)"><div class="plant" id="p3"></div></div>
    </div>
</div>

<div id="shop-screen" class="screen">
    <div class="tabs">
        <button id="btn-buy" class="tab-btn active" onclick="switchShop('buy')">КУПИТИ</button>
        <button id="btn-sell" class="tab-btn" onclick="switchShop('sell')">РИНОК</button>
    </div>

    <div id="buy-content">
        <div class="card"><span>🌾 Пшениця</span><button onclick="buySeed(20, '🌾')">20$</button></div>
        <div class="card"><span>🥔 Бараболя</span><button onclick="buySeed(40, '🥔')">40$</button></div>
        <div class="card"><span>🌽 Кукурудза</span><button onclick="buySeed(60, '🌽')">60$</button></div>
        <div class="card"><span>🥕 Морква</span><button onclick="buySeed(30, '🥕')">30$</button></div>
        <div class="card"><span>🌻 Соняшник</span><button onclick="buySeed(100, '🌻')">100$</button></div>
        <div class="card"><span>🎃 Гарбуз</span><button onclick="buySeed(120, '🎃')">120$</button></div>
        <div class="card"><span>🍅 Томати</span><button onclick="buySeed(50, '🍅')">50$</button></div>
        <div class="card"><span>🍉 Кавун</span><button onclick="buySeed(200, '🍉')">200$</button></div>
    </div>

    <div id="sell-content" style="display:none;">
        <button onclick="postToMarket()" style="width:100%; padding:12px; background:#f1c40f; color:#000; border:none; border-radius:8px; font-weight:bold; margin-bottom:15px;">ВИТАВИТИ ТОВАР</button>
        <div id="my-listings"></div>
    </div>
</div>

<div class="footer">
    <button class="nav-btn" onclick="showScreen('shop', this)"><span class="nav-icon">🛒</span>МАГАЗИН</button>
    <button class="nav-btn active" onclick="showScreen('farm', this)"><span class="nav-icon">🚜</span>ФЕРМА</button>
    <button class="nav-btn" onclick="tg.showAlert('Тут будуть твої досягнення!')"><span class="nav-icon">🏆</span>ВИВІД</button>
    <button class="nav-btn" onclick="tg.showAlert('Налаштування')"><span class="nav-icon">⚙️</span>ОПЦІЇ</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let balance = 500;
    let seeds = []; // Те, що купили
    let storage = []; // Те, що виростили
    let marketCount = 0;
    let states = [0, 0, 0, 0]; // 0-пусто, 1-росте, 2-готово, 3-зібрано

    function showScreen(id, btn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id + '-screen').classList.add('active-screen');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function switchShop(type) {
        document.getElementById('buy-content').style.display = type === 'buy' ? 'block' : 'none';
        document.getElementById('sell-content').style.display = type === 'sell' ? 'block' : 'none';
        document.getElementById('btn-buy').classList.toggle('active', type === 'buy');
        document.getElementById('btn-sell').classList.toggle('active', type === 'sell');
    }

    function buySeed(price, type) {
        if (balance >= price) {
            balance -= price;
            seeds.push(type);
            updateUI();
        } else { tg.showAlert("Не вистачає монет!"); }
    }

    function farm(id) {
        let p = document.getElementById('p' + id);
        if (states[id] === 0 && seeds.length > 0) {
            let crop = seeds.pop();
            states[id] = 1;
            p.innerText = "🌱";
            p.style.transform = "rotateX(-40deg) scale(0.5)";
            
            setTimeout(() => { p.innerText = "🌿"; p.style.transform = "rotateX(-40deg) scale(0.8)"; }, 3000);
            setTimeout(() => { p.innerText = crop; p.style.transform = "rotateX(-40deg) scale(1.2)"; states[id] = 2; }, 6000);
            updateUI();
        } else if (states[id] === 2) {
            let cropType = p.innerText;
            storage.push(cropType); // Додаємо вирощене на склад
            p.innerText = "";
            states[id] = 0;
            updateUI();
            tg.showAlert("Зібрано! Товар тепер на складі.");
        }
    }

    function postToMarket() {
        if (marketCount >= 3) { tg.showAlert("Максимум 3 лоти!"); return; }
        if (storage.length === 0) { tg.showAlert("Твій склад порожній! Спочатку вирости щось."); return; }

        let item = storage.pop();
        let price = prompt("За яку ціну продати " + item + "?", "100");
        let amount = prompt("Скільки штук?", "1");

        if (price > 0 && amount > 0) {
            marketCount++;
            let div = document.createElement('div');
            div.className = 'market-slot';
            div.innerHTML = `📦 <b>${item}</b> | Кількість: ${amount} | Ціна: ${price}$ <span style="float:right; color:red" onclick="this.parentElement.remove(); marketCount--;">✖</span>`;
            document.getElementById('my-listings').appendChild(div);
            updateUI();
        } else {
            storage.push(item); // Повертаємо назад, якщо скасували
        }
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance;
        document.getElementById('storage-count').innerText = storage.length;
    }
</script>
</body>
                                                                                          </html>
