<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        .balance { font-size: 40px; color: #ffad00; margin: 20px 0; }
        .card { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #ffad00; color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="balance"><span id="stars">0.0</span> ⭐</div>
    <div id="tasks"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const stars = params.get('stars') || "0.0";
        const channels = params.get('channels');

        document.getElementById('stars').innerText = stars;

        const taskList = document.getElementById('tasks');
        if (channels) {
            channels.split(',').forEach(item => {
                let [name, link] = item.split('|');
                if(name && link) {
                    taskList.innerHTML += `
                        <div class="card">
                            <div style="text-align:left"><b>${name}</b><br><small>+0.3 Stars</small></div>
                            <button class="btn" onclick="doTask('${link}', '${name}')">JOIN</button>
                        </div>`;
                }
            });
        } else {
            taskList.innerHTML = "<p>No tasks available</p>";
        }

        function doTask(url, name) {
            tg.openTelegramLink(url);
            tg.sendData("check:" + name);
        }
    </script>
</body>
</html>
