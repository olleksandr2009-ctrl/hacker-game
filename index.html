<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mine Stars App</title>
    <style>
        body { background: #05050a; color: white; font-family: 'Helvetica', sans-serif; text-align: center; margin: 0; }
        .balance-box { margin-top: 50px; }
        .stars-count { font-size: 60px; font-weight: bold; color: #ffca28; text-shadow: 0 0 15px rgba(255, 202, 40, 0.4); }
        .main-btn { width: 240px; margin-top: 40px; cursor: pointer; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        .main-btn:active { transform: scale(0.92); }
        .withdraw-btn { 
            background: linear-gradient(135deg, #ffca28, #ff8f00); color: black; 
            padding: 18px 45px; border-radius: 18px; font-weight: bold;
            display: inline-block; margin-top: 60px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 202, 40, 0.2);
        }
    </style>
</head>
<body>

    <div class="balance-box">
        <div id="stars" class="stars-count">0</div>
        <p style="opacity: 0.6; letter-spacing: 2px; font-size: 14px;">⭐ ЗІБРАНО STARS</p>
    </div>

    <img src="https://it-ua.net/wp-content/uploads/2024/06/Telegram-Stars.webp" class="main-btn" onclick="tapStar()">

    <br>
    <div class="withdraw-btn" onclick="sendWithdraw()">ВИВЕСТИ НА БАЛАНС</div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        let balance = 0;

        function tapStar() {
            balance += 1;
            document.getElementById('stars').innerText = balance;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function sendWithdraw() {
            tg.sendData("withdraw_request");
            tg.close();
        }

        tg.expand();
    </script>
</body>
</html>
