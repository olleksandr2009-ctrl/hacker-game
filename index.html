<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>AgroCraft: Isometric Edition</title>
    <style>
        body { margin: 0; background: #2c3e50; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .hud { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; pointer-events: none; }
        .inventory { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 12px; }
        .slot { width: 50px; height: 50px; background: #555; border: 3px solid #333; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; transition: 0.2s; }
        .slot.active { border-color: #f1c40f; background: #888; transform: translateY(-5px); }
    </style>
</head>
<body>

<div class="hud">
    <b>AgroCraft Isometric</b><br>
    Рух: WASD / Стрілочки<br>
    Клік: Поставити блок
</div>

<div class="inventory">
    <div class="slot active" onclick="sel(1, this)">🌱</div>
    <div class="slot" onclick="sel(2, this)">🧱</div>
    <div class="slot" onclick="sel(3, this)">🏠</div>
    <div class="slot" onclick="sel(4, this)">🌲</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

const TILE_W = 64; // Ширина ромба
const TILE_H = 32; // Висота ромба (вдвічі менша для кута)

let world = {};
let keys = {};
let player = { x: 0, y: 0, speed: 0.1, block: 1 };
let cam = { x: W/2, y: H/4 };

// Генерація початкової карти
for(let x = -5; x <= 5; x++) {
    for(let y = -5; y <= 5; y++) {
        world[`${x},${y}`] = 1;
    }
}

// Перетворення координат звичайних в ізометричні
function toIso(x, y) {
    return {
        isoX: (x - y) * (TILE_W / 2),
        isoY: (x + y) * (TILE_H / 2)
    };
}

function update() {
    if (keys['w'] || keys['ArrowUp']) { player.x -= player.speed; player.y -= player.speed; }
    if (keys['s'] || keys['ArrowDown']) { player.x += player.speed; player.y += player.speed; }
    if (keys['a'] || keys['ArrowLeft']) { player.x -= player.speed; player.y += player.speed; }
    if (keys['d'] || keys['ArrowRight']) { player.x += player.speed; player.y -= player.speed; }
}

function draw() {
    update();
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(cam.x, cam.y);

    // Малюємо сітку світу
    for (let key in world) {
        let [x, y] = key.split(',').map(Number);
        let pos = toIso(x, y);
        drawTile(pos.isoX, pos.isoY, world[key]);
    }

    // Малюємо персонажа
    let pPos = toIso(player.x, player.y);
    drawPlayer(pPos.isoX, pPos.isoY);

    ctx.restore();
    requestAnimationFrame(draw);
}

function drawTile(x, y, type) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + TILE_W / 2, y + TILE_H / 2);
    ctx.lineTo(x, y + TILE_H);
    ctx.lineTo(x - TILE_W / 2, y + TILE_H / 2);
    ctx.closePath();

    // Кольори для ізометрії
    const colors = { 1: '#27ae60', 2: '#7f8c8d', 3: '#e74c3c', 4: '#2ecc71' };
    ctx.fillStyle = colors[type];
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.2)";
    ctx.stroke();

    // Додаємо "бік" блоку для об'єму
    ctx.fillStyle = "rgba(0,0,0,0.1)";
    ctx.beginPath();
    ctx.moveTo(x - TILE_W / 2, y + TILE_H / 2);
    ctx.lineTo(x, y + TILE_H);
    ctx.lineTo(x, y + TILE_H + 10);
    ctx.lineTo(x - TILE_W / 2, y + TILE_H / 2 + 10);
    ctx.fill();
}

function drawPlayer(x, y) {
    // Тінь
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(x, y + TILE_H/2, 10, 5, 0, 0, Math.PI*2);
    ctx.fill();

    // Тіло
    ctx.fillStyle = "#f39c12";
    ctx.fillRect(x - 10, y - 40, 20, 40);
    // Голова
    ctx.fillStyle = "#e0ac69";
    ctx.fillRect(x - 8, y - 55, 16, 16);
}

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Будування в ізометрії (складніша математика кліку)
canvas.onclick = (e) => {
    let mouseX = e.clientX - cam.x;
    let mouseY = e.clientY - cam.y;

    // Зворотне перетворення координат
    let gy = (2 * mouseY - mouseX) / 2 / (TILE_H / 2);
    let gx = (mouseX + gy * (TILE_W / 2)) / (TILE_W / 2);
    
    world[`${Math.round(gx)},${Math.round(gy)}`] = player.block;
};

function sel(id, el) {
    player.block = id;
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
}

draw();
</script>
</body>
</html>
