<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; }
        .stat { font-size: 30px; color: #ffad00; margin: 20px; }
        .task { background: #222; border: 1px solid #444; padding: 15px; margin: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #ffad00; border: none; padding: 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="stat">⭐️ <span id="balance">0.0</span></div>
    <div id="container"></div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('balance').innerText = urlParams.get('stars') || '0.0';
        const rawChannels = urlParams.get('channels');
        if (rawChannels) {
            rawChannels.split(',').forEach(item => {
                let [name, link] = item.split('|');
                document.getElementById('container').innerHTML += `
                    <div class="task">
                        <span>${name}</span>
                        <button onclick="tg.openTelegramLink('${link}'); tg.sendData('check:${name}')">JOIN</button>
                    </div>`;
            });
        }
    </script>
</body>
</html>
