<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Agro Hacker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #2c3e50; margin: 0; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        .header { background: #1a252f; padding: 15px; display: flex; justify-content: space-between; border-bottom: 3px solid #27ae60; }
        .coins { color: #f1c40f; font-weight: bold; font-size: 20px; }
        
        .screen { display: none; height: 75vh; overflow-y: auto; padding: 15px; }
        .active-screen { display: block; }

        /* Магазин і Ринок */
        .tabs-header { display: flex; background: #34495e; }
        .tab-btn { flex: 1; padding: 10px; border: none; color: white; background: none; font-weight: bold; opacity: 0.5; }
        .tab-btn.active-tab { opacity: 1; border-bottom: 3px solid #27ae60; }

        /* Картки товарів */
        .item-card { background: #3e4f5f; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .market-slot { background: #16a085; padding: 10px; border-radius: 8px; margin-bottom: 5px; font-size: 13px; }

        /* Ферма */
        .farm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
        .plot { height: 100px; background: #3e2723; border: 4px solid #5d4037; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; }
        .plant { font-size: 40px; transition: 0.5s; }

        /* Футер */
        .footer { position: fixed; bottom: 0; width: 100%; display: flex; background: #1a252f; padding: 10px 0; }
        .nav-btn { flex: 1; background: none; border: none; color: #7f8c8d; display: flex; flex-direction: column; align-items: center; font-size: 10px; }
        .nav-btn.active { color: #27ae60; }
    </style>
</head>
<body>

<div class="header">
    <div class="coins">💰 <span id="balance">500</span></div>
    <div style="font-size: 12px; color: #ecf0f1;">Інвентар: <span id="inv-count">0</span></div>
</div>

<div id="shop-screen" class="screen">
    <div class="tabs-header">
        <button class="tab-btn active-tab" onclick="switchShopTab('buy')">МАГАЗИН</button>
        <button class="tab-btn" onclick="switchShopTab('sell')">РИНОК ГРАВЦІВ</button>
    </div>

    <div id="buy-tab" style="margin-top:15px;">
        <div class="item-card"><span>🌾 Пшениця</span><button onclick="buy(20, '🌾')">20$</button></div>
        <div class="item-card"><span>🥔 Бараболя</span><button onclick="buy(40, '🥔')">40$</button></div>
        <div class="item-card"><span>🌽 Кукурудза</span><button onclick="buy(60, '🌽')">60$</button></div>
        <div class="item-card"><span>🥕 Морква</span><button onclick="buy(30, '🥕')">30$</button></div>
        <div class="item-card"><span>🌻 Соняшник</span><button onclick="buy(100, '🌻')">100$</button></div>
        <div class="item-card"><span>🎃 Гарбуз</span><button onclick="buy(120, '🎃')">120$</button></div>
        <div class="item-card"><span>🍅 Томати</span><button onclick="buy(50, '🍅')">50$</button></div>
        <div class="item-card"><span>🍉 Кавун</span><button onclick="buy(200, '🍉')">200$</button></div>
    </div>

    <div id="sell-tab" style="display:none; margin-top:15px;">
        <button onclick="listOnMarket()" style="width:100%; padding:10px; background:#27ae60; border:none; color:white; border-radius:8px; margin-bottom:15px;">+ ПРОДАТИ ТОВАР</button>
        <div id="market-list">
            <p style="text-align:center; opacity:0.5;">Ваші активні лоти (макс 3):</p>
        </div>
    </div>
</div>

<div id="farm-screen" class="screen active-screen">
    <div class="farm-grid">
        <div class="plot" onclick="farm(0)"><div class="plant" id="p0"></div></div>
        <div class="plot" onclick="farm(1)"><div class="plant" id="p1"></div></div>
        <div class="plot" onclick="farm(2)"><div class="plant" id="p2"></div></div>
        <div class="plot" onclick="farm(3)"><div class="plant" id="p3"></div></div>
    </div>
</div>

<div class="footer">
    <button class="nav-btn active" onclick="showScreen('farm', this)">🚜 ФЕРМА</button>
    <button class="nav-btn" onclick="showScreen('shop', this)">🛒 МАГАЗИН</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    let balance = 500;
    let inventory = [];
    let marketSlots = 0;
    let states = [0,0,0,0];

    function showScreen(id, btn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id + '-screen').classList.add('active-screen');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function switchShopTab(tab) {
        document.getElementById('buy-tab').style.display = tab === 'buy' ? 'block' : 'none';
        document.getElementById('sell-tab').style.display = tab === 'sell' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active-tab', b.innerText.includes(tab === 'buy' ? 'МАГАЗИН' : 'РИНОК')));
    }

    function buy(price, emoji) {
        if (balance >= price) {
            balance -= price;
            inventory.push(emoji);
            updateUI();
        } else { tg.showAlert("Мало грошей!"); }
    }

    function listOnMarket() {
        if (marketSlots >= 3) { tg.showAlert("Максимум 3 лоти!"); return; }
        if (inventory.length === 0) { tg.showAlert("Немає чого продавати!"); return; }

        let count = prompt("Скільки продати? (доступно: " + inventory.length + ")", "1");
        let price = prompt("Введіть вашу ціну ($):", "100");

        if (count > 0 && count <= inventory.length && price > 0) {
            let item = inventory.pop();
            marketSlots++;
            let div = document.createElement('div');
            div.className = 'market-slot';
            div.innerHTML = `📦 <b>${item}</b> | К-сть: ${count} | Ціна: ${price}$ <span style="float:right; color:red" onclick="this.parentElement.remove(); marketSlots--;">✖</span>`;
            document.getElementById('market-list').appendChild(div);
            updateUI();
        }
    }

    function farm(id) {
        let p = document.getElementById('p' + id);
        if (states[id] === 0 && inventory.length > 0) {
            let crop = inventory.pop();
            states[id] = 1;
            p.innerText = "🌱"; 
            setTimeout(() => { p.innerText = "🌿"; }, 3000);
            setTimeout(() => { p.innerText = crop; states[id] = 2; }, 6000);
            updateUI();
        } else if (states[id] === 2) {
            balance += 50; // Прибуток
            p.innerText = "";
            states[id] = 0;
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance;
        document.getElementById('inv-count').innerText = inventory.length;
    }
</script>
</body>
</html>
