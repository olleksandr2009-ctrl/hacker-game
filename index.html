<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Agro Tycoon</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#48dbfb;--gold:#f1c40f;--green:#4cd137;--red:#e84118;--purple:#9b59b6;}
body{background:var(--bg);margin:0;font-family:sans-serif;color:white;overflow:hidden;user-select:none;}
.header{background:var(--card);padding:10px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;font-weight:bold;font-size:14px;align-items:center;}
.screen{display:none;height:82vh;overflow-y:auto;padding:15px;box-sizing:border-box;padding-bottom:100px;}
.active-screen{display:block;}
.farm-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;perspective:1000px;}
.plot{height:100px;background:#5d4037;border:3px solid #3e2723;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transform:rotateX(20deg);box-shadow:0 8px 0 #261b18; transition: 0.1s;}
.plot:active{transform: rotateX(20deg) translateZ(-5px); box-shadow: 0 4px 0 #261b18;}
.locked{background:#2f3640!important;opacity:0.8;}
.plant{font-size:40px;transform:rotateX(-20deg);position:absolute;top:10px;}
.timer{font-size:10px;color:var(--gold);transform:rotateX(-20deg);background:rgba(0,0,0,0.7);padding:2px 5px;border-radius:5px;margin-top:35px;}
.price-tag{position:absolute; color:var(--red); font-weight:bold; animation: floatUp 1s forwards; pointer-events:none; z-index:10;}
@keyframes floatUp{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-40px);}}
.card{background:var(--card);padding:12px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;border:1px solid #0f3460;}
.buy-btn{background:var(--accent);border:none;color:#1a1a2e;padding:8px 12px;border-radius:6px;font-weight:bold;}
.boost-btn{background:var(--purple);color:white;border:none;padding:8px 12px;border-radius:6px;font-weight:bold;}
.footer{position:fixed;bottom:0;width:100%;display:flex;background:var(--card);padding:10px 0;border-top:2px solid #0f3460;}
.nav-btn{flex:1;background:none;border:none;color:#95a5a6;display:flex;flex-direction:column;align-items:center;font-size:10px;}
.nav-btn.active{color:var(--accent);}
.scarecrow{font-size:50px;text-align:center;margin:5px 0;}
</style></head><body onload="init()">
<div class="header">
    <span style="color:var(--gold)">💰 <span id="balance">0.0</span></span>
    <span id="user-name" style="font-size:10px; color:#888;">Завантаження...</span>
    <span style="color:var(--accent)">💎 <span id="diamonds">0</span></span>
</div>

<div id="farm-screen" class="screen active-screen">
    <div class="scarecrow" id="main-scarecrow">👨‍🌾</div>
    <div style="text-align:center;font-size:11px;margin-bottom:10px;color:#aaa;">Рівень: <span id="lvl-display">1</span> | Склад: <span id="shop-limit">0</span>/1000</div>
    <div class="farm-grid" id="farm-grid"></div>
</div>

<div id="shop-screen" class="screen">
    <h3 style="color:var(--accent)">🛒 МАГАЗИН</h3>
    <div id="boost-list"></div>
    <div id="seed-list"></div>
    <button class="buy-btn" style="width:100%; background:var(--red); color:white; margin-top:10px;" onclick="sellEverythingToShop()">ПРОДАТИ ВРОЖАЙ (-30%)</button>
</div>

<div id="market-screen" class="screen">
    <h3 style="color:var(--gold)">⚖️ АУКЦІОН</h3>
    <div style="background:var(--card); padding:10px; border-radius:10px;">
        <select id="sell-item" style="width:100%; padding:10px; margin-bottom:5px; background:#0f3460; color:white; border:none;"></select>
        <input type="number" id="sell-amount" style="width:48%; padding:10px; background:#0f3460; color:white; border:none;" placeholder="К-сть">
        <input type="number" id="sell-price" style="width:48%; padding:10px; background:#0f3460; color:white; border:none;" placeholder="Ціна">
        <button class="buy-btn" style="width:100%; margin-top:10px; background:var(--gold);" onclick="postToAuction()">ВИСТАВИТИ НА РИНОК</button>
    </div>
    <div id="active-lots-list"></div>
</div>

<div id="exchange-screen" class="screen">
    <h3 style="text-align:center">📈 БІРЖА</h3>
    <div class="card" style="flex-direction:column; padding:20px;">
        <div id="d-price-box" style="font-size:20px; margin-bottom:10px;">1 💎 = <span id="d-price">500</span> 💰</div>
        <button class="buy-btn" style="width:100%" onclick="exchange()">ОБМІНЯТИ</button>
    </div>
</div>

<div class="footer">
    <button class="nav-btn active" onclick="show('farm',this)">🚜 ФЕРМА</button>
    <button class="nav-btn" onclick="show('shop',this)">🛒 ШОП</button>
    <button class="nav-btn" onclick="show('market',this)">⚖️ РИНОК</button>
    <button class="nav-btn" onclick="show('exchange',this)">📈 БІРЖА</button>
</div>

<script>
let tg = window.Telegram.WebApp; tg.expand();
let userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "local_user";
let userName = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Гравець";

let user = {
    balance: 10.0, diamonds: 0, level: 1, inventory: {}, 
    stats: {"🌾":0,"🥕":0,"🥔":0,"🍅":0,"🌽":0,"🌻":0,"🎃":0,"🍉":0},
    shopLimit: 400, unlockedPlots: [true, true, false, false], 
    plots: [null, null, null, null], activeLots: [],
    boosts: { speed: 1.0, yield: 1.0, scarecrow: false }
};

const crops = [
    {emoji:"🌾", name:"Пшениця", price:0.4, sell:1.2, time:20},
    {emoji:"🥕", name:"Морква", price:0.8, sell:2.0, time:60}
];

function init() {
    document.getElementById('user-name').innerText = userName;
    let saved = localStorage.getItem('agro_v9_' + userId);
    if (saved) user = JSON.parse(saved);
    renderFarm(); updateUI();
    setInterval(saveData, 5000);
}

function saveData() { localStorage.setItem('agro_v9_' + userId, JSON.stringify(user)); }

function renderFarm() {
    let g = document.getElementById('farm-grid'); g.innerHTML = '';
    user.unlockedPlots.forEach((u, i) => {
        let p = document.createElement('div'); p.className = `plot ${u?'':'locked'}`;
        p.id = "plot-" + i;
        if (!u) {
            p.innerHTML = `🔒 10💎`; p.onclick = () => unlockPlot(i);
        } else {
            p.innerHTML = `<div id="p${i}" class="plant"></div><div id="t${i}" class="timer" style="display:none"></div>`;
            p.onclick = (e) => handlePlot(i, e);
            if (user.plots[i]) startTimer(i);
        }
        g.appendChild(p);
    });
}

function handlePlot(i, event) {
    let pObj = user.plots[i];
    // Посадка
    if (!pObj) {
        let seed = Object.keys(user.inventory).find(k => user.inventory[k] > 0);
        if (!seed) return tg.showAlert("Купіть насіння!");
        let c = crops.find(x => x.emoji == seed);
        user.inventory[seed]--;
        
        // Показуємо мінус монетки (хоча насіння вже куплене, покажемо ціну для інфи)
        showPriceAnim(i, "-" + c.price);

        let fTime = c.time * user.boosts.speed;
        if(user.boosts.scarecrow) fTime *= 0.8;
        user.plots[i] = {...c, finish: Date.now() + (fTime * 1000), ready: false};
        startTimer(i);
    } 
    // Збір (Тільки якщо готово)
    else if (pObj.ready) {
        let amount = Math.floor(Math.random() * 3) + 1; // Рандом 1-3
        if (user.boosts.yield > 1) amount = 3; // Буст ГМО дає завжди максимум
        
        user.stats[pObj.emoji] += amount;
        tg.showPopup({message: `Зібрано ${pObj.emoji} x${amount} шт.`});
        user.plots[i] = null;
        renderFarm();
        updateUI();
    }
}

function showPriceAnim(i, text) {
    let el = document.getElementById('plot-' + i);
    let tag = document.createElement('div');
    tag.className = 'price-tag';
    tag.innerText = text;
    el.appendChild(tag);
    setTimeout(() => tag.remove(), 1000);
}

function startTimer(i) {
    let p = user.plots[i];
    let it = setInterval(() => {
        let d = p.finish - Date.now();
        let elP = document.getElementById('p' + i), elT = document.getElementById('t' + i);
        if (!elP || !user.plots[i]) return clearInterval(it);
        if (d <= 0) {
            p.ready = true; elP.innerText = p.emoji; elT.innerText = "ГОТОВО!"; clearInterval(it);
        } else {
            elP.innerText = "🌱"; elT.style.display = "block"; elT.innerText = Math.floor(d/1000) + "s";
        }
    }, 1000);
}

function updateUI() {
    document.getElementById('balance').innerText = user.balance.toFixed(1);
    document.getElementById('diamonds').innerText = user.diamonds;
    document.getElementById('lvl-display').innerText = user.level;
    document.getElementById('shop-limit').innerText = user.shopLimit;
}

function buySeed(idx) {
    let c = crops[idx];
    if (user.balance >= c.price) {
        user.balance -= c.price;
        user.inventory[c.emoji] = (user.inventory[c.emoji] || 0) + 1;
        updateUI(); renderShop();
    } else tg.showAlert("Мало монет!");
}

function renderShop() {
    let h = '<h4>Насіння:</h4>';
    crops.forEach((c, i) => {
        h += `<div class="card">
            <div>${c.emoji} ${c.name} (${user.inventory[c.emoji]||0})</div>
            <button class="buy-btn" onclick="buySeed(${i})">${c.price}💰</button>
        </div>`;
    });
    document.getElementById('seed-list').innerHTML = h;
    
    let b = `<h4>Бусти:</h4>
        <div class="card"><div>📦 ГМО (Завжди 3 врожаю)</div><button class="boost-btn" onclick="buyGmo()">15💎</button></div>`;
    document.getElementById('boost-list').innerHTML = b;
}

function buyGmo() {
    if(user.diamonds >= 15) { user.diamonds -= 15; user.boosts.yield = 1.5; updateUI(); tg.showAlert("Тепер завжди випадає 3 одиниці!"); }
}

function show(s, b) {
    document.querySelectorAll('.screen').forEach(x => x.classList.remove('active-screen'));
    document.getElementById(s + '-screen').classList.add('active-screen');
    document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if (s == 'shop') renderShop();
}

function sellEverythingToShop() {
    let t = 0; for(let e in user.stats) { let c = crops.find(x => x.emoji == e); if(c && user.stats[e]>0) { t += (user.stats[e]*c.sell*0.7); user.stats[e]=0; } }
    user.balance += t; updateUI(); tg.showAlert("Продано за " + t.toFixed(1));
}
</script></body></html>
