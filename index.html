<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Agro Tycoon</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#48dbfb;--gold:#f1c40f;--green:#4cd137;--red:#e84118;}
body{background:var(--bg);margin:0;font-family:sans-serif;color:white;overflow:hidden;user-select:none;}
.header{background:var(--card);padding:10px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;font-weight:bold;font-size:14px;}
.screen{display:none;height:82vh;overflow-y:auto;padding:15px;box-sizing:border-box;padding-bottom:100px;}
.active-screen{display:block;}
.farm-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;perspective:1000px;}
.plot{height:100px;background:#5d4037;border:3px solid #3e2723;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transform:rotateX(20deg);box-shadow:0 8px 0 #261b18;}
.locked{background:#2f3640!important;opacity:0.8;}
.plant{font-size:40px;transform:rotateX(-20deg);position:absolute;top:10px;}
.timer{font-size:10px;color:var(--gold);transform:rotateX(-20deg);background:rgba(0,0,0,0.7);padding:2px 5px;border-radius:5px;margin-top:35px;}
.card{background:var(--card);padding:12px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;border:1px solid #0f3460;}
.buy-btn{background:var(--accent);border:none;color:#1a1a2e;padding:8px 12px;border-radius:6px;font-weight:bold;}
.market-panel{background:#1e272e;padding:12px;border-radius:12px;border:1px solid var(--accent);margin-bottom:15px;}
.m-input{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none;background:#0f3460;color:white;box-sizing:border-box;}
.m-btn{background:var(--gold);color:#1a1a2e;border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold;margin-top:10px;}
.footer{position:fixed;bottom:0;width:100%;display:flex;background:var(--card);padding:10px 0;border-top:2px solid #0f3460;}
.nav-btn{flex:1;background:none;border:none;color:#95a5a6;display:flex;flex-direction:column;align-items:center;font-size:10px;}
.nav-btn.active{color:var(--accent);}
</style></head><body onload="init()">
<div class="header">
    <span style="color:var(--gold)">💰 <span id="balance">10.0</span></span>
    <span style="color:var(--accent)">💎 <span id="diamonds">0</span></span>
    <span id="lvl-display" style="color:var(--green)">LVL 1</span>
</div>
<div id="farm-screen" class="screen active-screen">
    <div style="text-align:center;font-size:11px;margin-bottom:10px;color:#aaa;">Склад: <span id="shop-limit">0</span>/1000</div>
    <div class="farm-grid" id="farm-grid"></div>
</div>
<div id="shop-screen" class="screen">
    <h3 style="color:var(--accent)">🛒 МАГАЗИН</h3>
    <div id="seed-list"></div>
</div>
<div id="market-screen" class="screen">
    <h3 style="color:var(--gold)">🏪 РИНОК</h3>
    <div class="market-panel">
        <select id="sell-item" class="m-input"></select>
        <input type="number" id="sell-amount" class="m-input" placeholder="Кількість">
        <select id="sell-currency" class="m-input">
            <option value="gold">Золото (💰)</option>
            <option value="diamond">Алмази (💎)</option>
        </select>
        <input type="number" id="sell-price" class="m-input" step="0.1" placeholder="Ціна">
        <button class="m-btn" onclick="postToMarket()">ПРОДАТИ</button>
    </div>
    <div id="stats-display" style="font-size:12px;background:var(--card);padding:10px;border-radius:8px;"></div>
</div>
<div id="exchange-screen" class="screen">
    <h3 style="text-align:center">📈 БІРЖА</h3>
    <div class="card" style="flex-direction:column;padding:20px;text-align:center;">
        <div style="font-size:24px;margin-bottom:10px;"><span id="d-price">500</span> 💰 <span id="trend">━</span></div>
        <button class="buy-btn" style="width:100%;height:45px;" onclick="exchange()">КУПИТИ 1 💎</button>
    </div>
</div>
<div class="footer">
    <button class="nav-btn active" onclick="show('farm',this)">🚜 ФЕРМА</button>
    <button class="nav-btn" onclick="show('shop',this)">🛒 ШОП</button>
    <button class="nav-btn" onclick="show('market',this)">🏪 РИНОК</button>
    <button class="nav-btn" onclick="show('exchange',this)">📈 БІРЖА</button>
</div>
<script>
let tg=window.Telegram.WebApp;tg.expand();
let user={balance:10.0,diamonds:0,dFrags:0,level:1,inventory:{},stats:{"🌾":0,"🥕":0,"🥔":0,"🍅":0,"🌽":0,"🌻":0,"🎃":0,"🍉":0},shopLimit:400,lastStock:Date.now(),lastPrice:Date.now(),dPrice:500,dOldPrice:500,unlockedPlots:[true,true,false,false],plots:[null,null,null,null]};
const crops=[{id:0,name:"Пшениця",emoji:"🌾",price:0.4,sell:1.2,time:60,lvl:1},{id:1,name:"Морква",emoji:"🥕",price:0.8,sell:2.0,time:180,lvl:2},{id:2,name:"Бараболя",emoji:"🥔",price:1.5,sell:3.5,time:600,lvl:3},{id:3,name:"Томати",emoji:"🍅",price:2.5,sell:6.0,time:1200,lvl:4},{id:4,name:"Кукурудза",emoji:"🌽",price:4.0,sell:10.0,time:3600,lvl:5},{id:5,name:"Соняшник",emoji:"🌻",price:6.0,sell:15.0,time:7200,lvl:6},{id:6,name:"Гарбуз",emoji:"🎃",price:8.0,sell:20.0,time:14400,lvl:7},{id:7,name:"Кавун",emoji:"🍉",price:10.0,sell:15.0,time:28800,lvl:8}];
function save(){localStorage.setItem('agro_v6',JSON.stringify(user));}
function init(){let s=localStorage.getItem('agro_v6');if(s){user=JSON.parse(s);checkStock();updateMarket();}renderFarm();updateUI();setInterval(save,5000);setInterval(updateMarket,60000);}
function checkStock(){let h=Math.floor((Date.now()-user.lastStock)/18000000);if(h>0){user.shopLimit=Math.min(user.shopLimit+(h*200),1000);user.lastStock=Date.now();}}
function updateMarket(){if(Date.now()-user.lastPrice>1800000){user.dOldPrice=user.dPrice;user.dPrice=Math.floor(400+Math.random()*250);user.lastPrice=Date.now();}let t=document.getElementById('trend');t.innerText=user.dPrice>user.dOldPrice?"📈":"📉";t.style.color=user.dPrice>user.dOldPrice?"#4cd137":"#e84118";document.getElementById('d-price').innerText=user.dPrice;}
function renderFarm(){let g=document.getElementById('farm-grid');g.innerHTML='';user.unlockedPlots.forEach((u,i)=>{let p=document.createElement('div');p.className=`plot ${u?'':'locked'}`;if(!u){let c=i==2?10:25;p.innerHTML=`🔒 ${c}💎`;p.onclick=()=>unlock(i,c);}else{p.innerHTML=`<div id="p${i}" class="plant"></div><div id="t${i}" class="timer" style="display:none"></div>`;p.onclick=()=>handlePlot(i);if(user.plots[i])startTimer(i);}g.appendChild(p);});}
function handlePlot(i){if(!user.plots[i]){let e=Object.keys(user.inventory).find(k=>user.inventory[k]>0);if(!e)return tg.showAlert("Немає насіння!");let c=crops.find(x=>x.emoji==e);user.inventory[e]--;user.plots[i]={...c,finish:Date.now()+(c.time*1000),ready:false};startTimer(i);}else if(user.plots[i].ready){user.stats[user.plots[i].emoji]++;user.balance+=user.plots[i].sell;user.plots[i]=null;checkLvl();renderFarm();updateUI();}}
function startTimer(i){let p=user.plots[i];let it=setInterval(()=>{let d=p.finish-Date.now();let elP=document.getElementById('p'+i),elT=document.getElementById('t'+i);if(!elP)return clearInterval(it);if(d<=0){p.ready=true;elP.innerText=p.emoji;elT.innerText="ГОТОВО!";clearInterval(it);}else{elP.innerText="🌱";elT.style.display="block";let s=Math.floor(d/1000);elT.innerText=s>60?Math.floor(s/60)+"m":s+"s";}},1000);}
function buy(i){let c=crops[i];if(user.level<c.lvl||user.shopLimit<=0||user.balance<c.price)return tg.showAlert("Неможливо купити!");user.balance-=c.price;user.shopLimit--;user.inventory[c.emoji]=(user.inventory[c.emoji]||0)+1;updateUI();renderShop();}
function postToMarket(){let e=document.getElementById('sell-item').value,a=parseInt(document.getElementById('sell-amount').value),c=document.getElementById('sell-currency').value,p=parseFloat(document.getElementById('sell-price').value);if(!a||a<=0||p<=0||(user.stats[e]||0)<a)return tg.showAlert("Помилка!");user.stats[e]-=a;if(c=='gold')user.balance+=p*0.95;else{user.dFrags+=p;let w=Math.floor(user.dFrags);user.diamonds+=w;user.dFrags-=w;}updateUI();tg.showAlert("Продано!");}
function checkLvl(){if(user.level==1&&user.stats["🌾"]>=50)user.level=2;if(user.level==2&&user.stats["🌾"]>=150&&user.stats["🥕"]>=40)user.level=3;}
function unlock(i,c){if(user.diamonds>=c){user.diamonds-=c;user.unlockedPlots[i]=true;renderFarm();updateUI();}}
function updateUI(){document.getElementById('balance').innerText=user.balance.toFixed(1);document.getElementById('diamonds').innerText=user.diamonds+(user.dFrags>0?`+${user.dFrags.toFixed(1)}`:"");document.getElementById('shop-limit').innerText=user.shopLimit;document.getElementById('lvl-display').innerText="LVL "+user.level;}
function renderShop(){let h='';crops.forEach((c,i)=>{let l=user.level<c.lvl;h+=`<div class="card ${l?'locked':''}"><div><b>${c.emoji}${c.name}</b><br><small>В тебе: ${user.inventory[c.emoji]||0}</small></div>${l?'🔒':`<button class="buy-btn" onclick="buy(${i})">${c.price}💰</button>`}</div>`;});document.getElementById('seed-list').innerHTML=h;}
function show(s,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active-screen'));document.getElementById(s+'-screen').classList.add('active-screen');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(s=='shop')renderShop();if(s=='market'){let o='';crops.forEach(c=>o+=`<option value="${c.emoji}">${c.emoji} ${c.name} (${user.stats[c.emoji]||0})</option>`);document.getElementById('sell-item').innerHTML=o;let st='';for(let e in user.stats)if(user.stats[e]>0)st+=`${e}:${user.stats[e]} `;document.getElementById('stats-display').innerText=st||'Пусто';}}
function exchange(){if(user.balance>=user.dPrice){user.balance-=user.dPrice;user.diamonds++;updateUI();}}
</script></body></html>
