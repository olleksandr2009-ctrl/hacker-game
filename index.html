<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c1c1c; color: white; margin: 0; padding: 15px; }
        .header { text-align: center; font-size: 24px; padding: 20px; color: #ffad00; }
        .card { background: #2d2d2d; border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444; }
        .btn { background: #ffad00; color: black; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #2d2d2d; display: flex; border-top: 1px solid #444; }
        .nav-item { flex: 1; text-align: center; padding: 15px; color: #888; cursor: pointer; }
        .nav-item.active { color: #ffad00; border-top: 2px solid #ffad00; }
        #withdraw-page { display: none; text-align: center; }
    </style>
</head>
<body>
    <div id="earn-page">
        <div class="header">💰 <span id="stars-balance">0.0</span> Stars</div>
        <div id="channels-list">
            <div class="card">
                <div><strong>Paws & Tails</strong><br><small>+0.4 Stars</small></div>
                <button class="btn" onclick="subscribe('https://t.me/paws_tails_test')">Підписатися</button>
            </div>
        </div>
    </div>

    <div id="withdraw-page">
        <div class="header">💳 Вивід</div>
        <p>Мінімум: 15 Stars</p>
        <button class="btn" style="width: 80%;" onclick="requestWithdraw()">Вивести Stars</button>
    </div>

    <div class="nav">
        <div class="nav-item active" id="btn-earn" onclick="tab('earn')">Заробити</div>
        <div class="nav-item" id="btn-withdraw" onclick="tab('withdraw')">Вивести</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function tab(name) {
            document.getElementById('earn-page').style.display = name === 'earn' ? 'block' : 'none';
            document.getElementById('withdraw-page').style.display = name === 'withdraw' ? 'block' : 'none';
            document.getElementById('btn-earn').classList.toggle('active', name === 'earn');
            document.getElementById('btn-withdraw').classList.toggle('active', name === 'withdraw');
        }

        function subscribe(link) {
            tg.openTelegramLink(link);
            // Тут відправляємо боту сигнал, що юзер перейшов
            tg.sendData("check_sub"); 
        }

        function requestWithdraw() {
            tg.sendData("withdraw_request");
        }
    </script>
</body>
</html>
