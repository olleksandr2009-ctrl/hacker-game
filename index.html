<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Agro Empire: Mining & Farming</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#48dbfb;--gold:#f1c40f;--green:#2ecc71;--dirt:#5d4037;--grass:#27ae60;--stone:#7f8c8d;}
body{background:var(--bg);margin:0;font-family:sans-serif;color:white;overflow:hidden;user-select:none;}
.header{background:var(--card);padding:10px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;font-size:12px;position:sticky;top:0;z-index:100;}
.screen{display:none;height:82vh;overflow-y:auto;padding:15px;box-sizing:border-box;padding-bottom:120px;}
.active-screen{display:block;}
.tabs-loc{display:flex;gap:10px;margin-bottom:15px;}
.tab-btn{flex:1;padding:8px;border-radius:8px;border:none;background:var(--card);color:white;font-weight:bold;border:1px solid #333;}
.tab-btn.active{background:var(--accent);color:#1a1a2e;border-color:white;}
.farm-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:10px;padding-bottom:100px;}
.slot{height:140px;background:var(--grass);border:3px solid #1e8449;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 0 #145a32;}
.slot.item-plot{background:var(--dirt); border-color:#3e2723;}
.slot.item-stone{background:var(--stone); border-color:#5a6263; box-shadow:0 6px 0 #3e4444;}
.slot.locked{background:#1a1a2e; border: 2px dashed #444; opacity:0.6; box-shadow:none;}
.footer{position:fixed;bottom:0;width:100%;display:flex;background:var(--card);padding:10px 0;border-top:2px solid #0f3460;z-index:100;}
.nav-btn{flex:1;background:none;border:none;color:#95a5a6;display:flex;flex-direction:column;align-items:center;font-size:8px;}
.nav-btn.active{color:var(--accent);}
.m-btn{background:var(--gold);color:#1a1a2e;border:none;padding:10px;border-radius:8px;font-weight:bold;width:100%;margin-top:5px;cursor:pointer;}
.card{background:var(--card);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #0f3460;}
.progress-bar{background:#333; height:8px; border-radius:4px; margin-top:5px; overflow:hidden;}
.progress-fill{background:var(--accent); height:100%; width:0%; transition:0.3s;}
</style></head><body onload="init()">

<div class="header">
    <div style="color:var(--gold)">💰 <span id="balance">0</span></div>
    <div id="level-display">Рівень 1</div>
    <div style="color:var(--accent)">💎 <span id="diamonds">0.0</span></div>
</div>

<div id="map-screen" class="screen active-screen">
    <div class="tabs-loc">
        <button id="tab-farm" class="tab-btn active" onclick="switchLoc('farm')">🚜 ПОЛЕ</button>
        <button id="tab-mine" class="tab-btn" onclick="switchLoc('mine')">⛏️ КАР'ЄР</button>
    </div>
    <div class="farm-grid" id="main-grid"></div>
</div>

<div id="shop-screen" class="screen">
    <div class="card">
        <h4 style="margin:0;color:var(--accent)">🏗️ БУДІВНИЦТВО</h4>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <button class="m-btn" onclick="buyObject('plot', 10)">🌱 Грядка (10💰)</button>
            <button class="m-btn" style="background:#bdc3c7" onclick="buyObject('stone', 50)">🪨 Камінь (50💰)</button>
        </div>
    </div>
    <div class="card">
        <h4 style="margin:0;color:var(--gold)">🛒 НАСІННЯ</h4>
        <div id="seed-list"></div>
    </div>
</div>

<div id="progress-screen" class="screen">
    <h3 style="color:var(--accent)">🏆 ПРОГРЕС</h3>
    <div id="quest-list"></div>
</div>

<div id="dealer-screen" class="screen">
    <h3 style="color:var(--green)">🚚 ЦЕНТРАЛЬНИЙ СКУПЩИК</h3>
    <div id="inventory-sell"></div>
    <button class="m-btn" style="background:var(--green);color:white;margin-top:15px;" onclick="sellAll()">ПРОДАТИ ВЕСЬ ТОВАР</button>
</div>

<div class="footer">
    <button class="nav-btn active" onclick="show('map',this)">🗾 КАРТА</button>
    <button class="nav-btn" onclick="show('shop',this)">🛒 ШОП</button>
    <button class="nav-btn" onclick="show('progress',this)">🏆 ПРОГРЕС</button>
    <button class="nav-btn" onclick="show('dealer',this)">🚚 СКУПЩИК</button>
</div>

<script>
let tg = window.Telegram.WebApp;
let currentLoc = 'farm';
let user = {
    balance: 10, diamonds: 0, level: 1, totalHarvests: 0,
    inventory: { plot: 1, stone: 0, seeds: {} },
    map_farm: [ {type:'plot', data:null}, null, null, null ],
    map_mine: [ null, null, null, null ],
    slots_farm: 4, slots_mine: 4, stats: {}, unlockedIdx: 0 
};

const crops = [
    {e:"🌾", n:"Пшениця", p:0.5, s:1, t:60, req:0},
    {e:"🌽", n:"Кукурудза", p:1.2, s:3, t:300, req:10},
    {e:"🥕", n:"Морква", p:3, s:8, t:1800, req:30},
    {e:"🍅", n:"Томат", p:7, s:20, t:3600, req:70},
    {e:"🥔", n:"Картопля", p:12, s:35, t:7200, req:150},
    {e:"🍓", n:"Полуниця", p:20, s:65, t:14400, req:300},
    {e:"🌻", n:"Соняшник", p:35, s:120, t:28800, req:600},
    {e:"🎃", n:"Гарбуз", p:55, s:200, t:43200, req:1000},
    {e:"🍉", n:"Кавун", p:80, s:350, t:64800, req:1500},
    {e:"🍇", n:"Виноград", p:100, s:500, t:86400, req:2500}
];

function init() {
    let saved = localStorage.getItem('agro_mining_v1');
    if(saved) user = JSON.parse(saved);
    updateUI(); renderMap();
    setInterval(() => { renderMap(); updateUI(); checkQuests(); }, 1000);
}

function switchLoc(loc) {
    currentLoc = loc;
    document.getElementById('tab-farm').classList.toggle('active', loc==='farm');
    document.getElementById('tab-mine').classList.toggle('active', loc==='mine');
    renderMap();
}

function updateUI() {
    document.getElementById('balance').innerText = user.balance.toFixed(1);
    document.getElementById('diamonds').innerText = user.diamonds.toFixed(1);
    document.getElementById('level-display').innerText = "Рівень " + user.level;
}

function checkQuests() {
    let next = crops[user.unlockedIdx + 1];
    if(next && user.totalHarvests >= next.req) {
        user.unlockedIdx++; user.level++;
        tg.showAlert("НОВИЙ РІВЕНЬ! Відкрито: " + next.n);
        save();
    }
}

function renderMap() {
    let g = document.getElementById('main-grid'); g.innerHTML = '';
    let isFarm = currentLoc === 'farm';
    let map = isFarm ? user.map_farm : user.map_mine;
    let maxSlots = isFarm ? user.slots_farm : user.slots_mine;

    for(let i=0; i < 20; i++) {
        let d = document.createElement('div');
        if(i < maxSlots) {
            let obj = map[i];
            d.className = 'slot';
            if(!obj) {
                d.innerHTML = "<span style='opacity:0.2;font-size:30px;'>+</span>";
                d.onclick = () => placeObject(i);
            } else {
                if(obj.type === 'plot') {
                    d.classList.add('item-plot');
                    if(obj.data) {
                        let left = Math.ceil((obj.data.finish - Date.now())/1000);
                        if(left <= 0) d.innerHTML = `<b>${obj.data.emoji}</b><br><small>ЗІБРАТИ</small>`;
                        else d.innerHTML = `🌱<br><small>${formatTime(left)}</small>`;
                    } else d.innerHTML = "🟫<br><small>ГОТОВО</small>";
                } else {
                    d.classList.add('item-stone');
                    let left = Math.ceil((obj.next - Date.now())/1000);
                    if(left <= 0) d.innerHTML = `💎<br><small>ЗАБРАТИ</small>`;
                    else d.innerHTML = `⏳<br><small>${formatTime(left)}</small>`;
                }
                d.onclick = () => handleObject(i);
            }
        } else if(i === maxSlots) {
            let cost = maxSlots * 100;
            d.className = 'slot locked';
            d.innerHTML = `🔒<br><small>${cost}💰</small>`;
            d.onclick = () => buyLand(cost);
        } else { d.className = 'slot locked'; d.innerHTML = "🔒"; }
        g.appendChild(d);
    }
}

function formatTime(s) {
    if(s <= 0) return "0с";
    let h = Math.floor(s/3600);
    let m = Math.floor((s%3600)/60);
    let sec = s%60;
    return `${h>0?h+'г':''} ${m}хв ${sec}с`;
}

function handleObject(i) {
    let map = currentLoc === 'farm' ? user.map_farm : user.map_mine;
    let obj = map[i];
    if(obj.type === 'plot') {
        if(!obj.data) {
            let s = Object.keys(user.inventory.seeds).find(k => user.inventory.seeds[k] > 0);
            if(!s) return tg.showAlert("Немає насіння!");
            let crop = crops.find(x => x.e === s);
            user.inventory.seeds[s]--;
            obj.data = { emoji: s, finish: Date.now() + (crop.t * 1000) };
        } else if(Date.now() >= obj.data.finish) {
            user.stats[obj.data.emoji] = (user.stats[obj.data.emoji] || 0) + 1;
            user.totalHarvests++;
            obj.data = null;
        }
    } else {
        if(Date.now() >= obj.next) {
            user.diamonds += 0.2;
            obj.next = Date.now() + 7200000; // 2 години на малий камінь
            tg.showAlert("Отримано 0.2 💎");
        }
    }
    save();
}

function placeObject(i) {
    if(currentLoc === 'farm') {
        if(user.inventory.plot > 0) { user.inventory.plot--; user.map_farm[i] = {type:'plot', data:null}; }
        else tg.showAlert("Купи грядку!");
    } else {
        if(user.inventory.stone > 0) { user.inventory.stone--; user.map_mine[i] = {type:'stone', next:Date.now()+7200000}; }
        else tg.showAlert("Купи камінь!");
    }
    renderMap(); save();
}

function buyLand(cost) {
    if(user.balance >= cost) {
        user.balance -= cost;
        if(currentLoc === 'farm') { user.slots_farm++; user.map_farm.push(null); }
        else { user.slots_mine++; user.map_mine.push(null); }
        save(); renderMap();
    }
}

function buySeed(e, p) {
    if(user.balance >= p) { user.balance -= p; user.inventory.seeds[e] = (user.inventory.seeds[e]||0)+1; save(); updateUI(); }
}

function buyObject(id, cost) {
    if(user.balance >= cost) { user.balance -= cost; user.inventory[id]++; save(); updateUI(); }
}

function renderShop() {
    let h = "";
    crops.forEach((c, idx) => {
        let locked = idx > user.unlockedIdx;
        h += `<div class="card" style="opacity:${locked?0.5:1}">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <span>${locked?'🔒':c.e} ${c.n} <small>(${c.p}💰)</small></span>
                <button onclick="buySeed('${c.e}', ${c.p})" class="m-btn" style="width:auto;margin:0;" ${locked?'disabled':''}>КУПИТИ</button>
            </div>
        </div>`;
    });
    document.getElementById('seed-list').innerHTML = h;
}

function renderQuests() {
    let h = "";
    crops.forEach((c, idx) => {
        if(idx === 0) return;
        let prog = Math.min(100, (user.totalHarvests / c.req) * 100);
        h += `<div class="card">
            <div style="display:flex;justify-content:space-between;font-size:12px;"><span>Відкрити ${c.e} ${c.n}</span><span>${user.totalHarvests}/${c.req}</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
        </div>`;
    });
    document.getElementById('quest-list').innerHTML = h;
}

function renderDealer() {
    let h = ""; let empty = true;
    for(let e in user.stats) {
        if(user.stats[e] > 0) {
            let crop = crops.find(x => x.e === e);
            h += `<div class="card" style="display:flex;justify-content:space-between;margin-bottom:5px;">
                <span>${e} ${crop.n} (x${user.stats[e]})</span>
                <span style="color:var(--gold)">+${(user.stats[e]*crop.s).toFixed(1)} 💰</span>
            </div>`;
            empty = false;
        }
    }
    document.getElementById('inventory-sell').innerHTML = empty ? "<center>Склад порожній. Час щось посадити!</center>" : h;
}

function sellAll() {
    let inc = 0;
    for(let e in user.stats) {
        let crop = crops.find(x => x.e === e);
        inc += user.stats[e] * crop.s;
        user.stats[e] = 0;
    }
    if(inc > 0) { user.balance += inc; save(); renderDealer(); tg.showAlert("Продано на " + inc.toFixed(1) + " 💰"); }
}

function show(s, b) {
    document.querySelectorAll('.screen').forEach(x => x.classList.remove('active-screen'));
    document.getElementById(s + '-screen').classList.add('active-screen');
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    b.classList.add('active');
    if(s === 'shop') renderShop();
    if(s === 'progress') renderQuests();
    if(s === 'dealer') renderDealer();
}

function save() { localStorage.setItem('agro_mining_v1', JSON.stringify(user)); }
</script></body></html>
