<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>Agro Empire: Pro Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f0c29; --card: rgba(22, 33, 62, 0.8); --accent: #48dbfb;
            --gold: #f1c40f; --green: #2ecc71; --dirt: #5d4037;
            --grass: #27ae60; --stone: #7f8c8d; --red: #e74c3c;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            margin: 0; font-family: 'Segoe UI', sans-serif; color: white;
            overflow: hidden; user-select: none;
        }

        /* Анімації */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .header { background: var(--card); padding: 10px; border-bottom: 2px solid var(--accent); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .stats-line { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 8px; }
        
        .level-bar-container { flex-grow: 1; background: #333; height: 14px; border-radius: 7px; overflow: hidden; position: relative; border: 1px solid #444; }
        .level-bar-fill { background: linear-gradient(90deg, #00d2ff, #3a7bd5); height: 100%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .level-text { position: absolute; width: 100%; text-align: center; font-size: 9px; font-weight: bold; line-height: 14px; color: white; text-shadow: 1px 1px 1px black; }

        .screen { display: none; height: 78vh; overflow-y: auto; padding: 15px; box-sizing: border-box; padding-bottom: 150px; animation: fadeIn 0.4s ease-out; }
        .active-screen { display: block; }

        .card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.2s, border-color 0.2s; }
        .card:active { transform: scale(0.98); }

        .m-btn { background: var(--gold); color: #1a1a2e; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 5px; cursor: pointer; transition: 0.2s; }
        .m-btn:active { transform: scale(0.92); }

        .farm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .slot { height: 130px; background: var(--grass); border: 3px solid #1e8449; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; box-shadow: 0 6px 0 #145a32; transition: 0.1s; }
        .slot:active { transform: translateY(4px); box-shadow: 0 2px 0 #145a32; }
        .slot.item-plot { background: var(--dirt); border-color: #3e2723; }
        .slot.locked { background: rgba(0,0,0,0.3); border: 2px dashed #555; opacity: 0.6; box-shadow: none; }

        .seed-selector { display: flex; gap: 10px; overflow-x: auto; padding: 10px; background: rgba(0,0,0,0.6); border-top: 1px solid var(--accent); position: fixed; bottom: 60px; width: 100%; z-index: 90; backdrop-filter: blur(5px); box-sizing: border-box; }
        .seed-icon { min-width: 45px; height: 45px; background: var(--card); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid transparent; position: relative; transition: 0.3s; }
        .seed-icon.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); transform: translateY(-5px); }

        /* Модальні вікна */
        #lvl-modal, #sell-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; background: var(--card); border: 2px solid var(--accent); border-radius: 20px; padding: 20px; z-index: 1000; backdrop-filter: blur(20px); text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease; }
        #sell-modal { border-color: var(--green); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; }

        .footer { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--card); padding: 12px 0; border-top: 2px solid #0f3460; z-index: 100; }
        .nav-btn { flex: 1; background: none; border: none; color: #95a5a6; display: flex; flex-direction: column; align-items: center; font-size: 9px; transition: 0.3s; }
        .nav-btn.active { color: var(--accent); transform: translateY(-3px); }
        
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--accent); margin: 8px 0; background: #0f3460; color: white; box-sizing: border-box; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #333; background: var(--card); color: white; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); color: #1a1a2e; }
    </style>
</head>
<body onload="init()">

<div class="overlay" id="overlay" onclick="closeAllModals()"></div>

<div id="lvl-modal">
    <h3 style="color:var(--accent);margin-top:0">🎯 ЗАВДАННЯ</h3>
    <div id="lvl-task-desc">Завантаження...</div>
    <button class="m-btn" onclick="closeAllModals()">ЗРОЗУМІЛО</button>
</div>

<div id="sell-modal">
    <h3 id="sell-title" style="color:var(--green);margin-top:0">🚚 ПРОДАЖ</h3>
    <p id="sell-info"></p>
    <input type="number" id="sell-input" placeholder="Скільки продати?">
    <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="m-btn" style="background:var(--red);color:white" onclick="closeAllModals()">ВІДМІНА</button>
        <button class="m-btn" style="background:var(--green);color:white" id="confirm-sell-btn">ПРОДАТИ</button>
    </div>
</div>

<div class="header">
    <div class="stats-line">
        <div style="color:var(--gold)">💰 <span id="balance">0</span></div>
        <div style="font-weight:bold;color:var(--accent);letter-spacing:1px">AGRO EMPIRE</div>
        <div style="color:var(--accent)">💎 <span id="diamonds">0.0</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
        <button class="lvl-btn" onclick="openLvlModal()" style="background:var(--accent);border:none;border-radius:5px;padding:3px 8px;font-size:10px;font-weight:bold;">LEVEL</button>
        <div class="level-bar-container">
            <div id="level-fill" class="level-bar-fill" style="width:0%"></div>
            <div class="level-text" id="level-display">Lvl 1 (0/10)</div>
        </div>
    </div>
</div>

<div id="map-screen" class="screen active-screen">
    <div class="tabs-loc" style="display:flex;gap:10px;margin-bottom:15px;">
        <button id="tab-farm" class="tab-btn active" onclick="switchLoc('farm')">🚜 ПОЛЕ</button>
        <button id="tab-mine" class="tab-btn" onclick="switchLoc('mine')">⛏️ КАР'ЄР</button>
    </div>
    <div class="farm-grid" id="main-grid"></div>
</div>

<div id="shop-screen" class="screen">
    <div class="card">
        <h4 style="margin:0;color:var(--accent)">🏗️ БУДІВНИЦТВО</h4>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
            <button class="m-btn" onclick="buyObject('plot', 10)">🌱 Грядка (10💰)</button>
            <button class="m-btn" style="background:#bdc3c7" onclick="buyObject('stone', 50)">🪨 Камінь (50💰)</button>
        </div>
    </div>
    <div class="card"><h4 style="margin:0;color:var(--gold)">🛒 НАСІННЯ</h4><div id="seed-list" style="margin-top:10px"></div></div>
</div>

<div id="auction-screen" class="screen">
    <div class="tabs-loc" style="display:flex;gap:10px;margin-bottom:15px;">
        <button id="auc-buy-tab" class="tab-btn active" onclick="switchAuc('buy')">🛒 КУПИТИ</button>
        <button id="auc-sell-tab" class="tab-btn" onclick="switchAuc('sell')">📦 МОЇ ЛОТИ</button>
    </div>
    <div id="auc-content"></div>
</div>

<div id="dealer-screen" class="screen">
    <h3 style="color:var(--green)">🚚 СКУПЩИК ВРОЖАЮ</h3>
    <div id="inventory-sell"></div>
    <button class="m-btn" style="background:var(--green);color:white;margin-top:15px;" onclick="sellAll()">ПРОДАТИ ВСЕ ВІДРАЗУ</button>
</div>

<div class="seed-selector" id="seed-bar"></div>

<div class="footer">
    <button class="nav-btn active" onclick="show('map',this)">🗾 КАРТА</button>
    <button class="nav-btn" onclick="show('shop',this)">🛒 ШОП</button>
    <button class="nav-btn" onclick="show('auction',this)">⚖️ АУКЦІОН</button>
    <button class="nav-btn" onclick="show('dealer',this)">🚚 СКУПЩИК</button>
</div>

<script>
let tg = window.Telegram.WebApp;
let currentLoc = 'farm';
let selectedSeed = null;
let currentSellEmoji = null;

let user = {
    balance: 20, diamonds: 0, level: 1, totalHarvests: 0,
    inventory: { plot: 1, stone: 0, seeds: {} },
    map_farm: [ {type:'plot', data:null}, null, null, null ],
    map_mine: [ null, null, null, null ],
    slots_farm: 4, slots_mine: 4, stats: {}, unlockedIdx: 0,
    myAuction: [] 
};

const crops = [
    {e:"🌾", n:"Пшениця", p:0.5, s:1, t:60, req:0},
    {e:"🌽", n:"Кукурудза", p:1.2, s:3, t:300, req:10},
    {e:"🥕", n:"Морква", p:3, s:8, t:1800, req:30},
    {e:"🍅", n:"Томат", p:7, s:20, t:3600, req:70},
    {e:"🥔", n:"Картопля", p:12, s:35, t:7200, req:150},
    {e:"🍓", n:"Полуниця", p:20, s:65, t:14400, req:300},
    {e:"🌻", n:"Соняшник", p:35, s:120, t:28800, req:600},
    {e:"🎃", n:"Гарбуз", p:55, s:200, t:43200, req:1000},
    {e:"🍉", n:"Кавун", p:80, s:350, t:64800, req:1500},
    {e:"🍇", n:"Виноград", p:100, s:500, t:86400, req:2500}
];

function init() {
    let saved = localStorage.getItem('agro_pro_v2');
    if(saved) user = JSON.parse(saved);
    updateUI(); renderMap();
    setInterval(() => { renderMap(); updateUI(); checkQuests(); }, 1000);
}

function updateUI() {
    document.getElementById('balance').innerText = user.balance.toFixed(1);
    document.getElementById('diamonds').innerText = user.diamonds.toFixed(1);
    let next = crops[user.unlockedIdx + 1] ? crops[user.unlockedIdx + 1].req : user.totalHarvests;
    let prev = crops[user.unlockedIdx].req;
    let prog = next === prev ? 100 : ((user.totalHarvests - prev) / (next - prev)) * 100;
    document.getElementById('level-fill').style.width = prog + "%";
    document.getElementById('level-display').innerText = `Lvl ${user.level} (${user.totalHarvests}/${next})`;

    let bar = document.getElementById('seed-bar');
    bar.innerHTML = "";
    let hasAny = false;
    Object.keys(user.inventory.seeds).forEach(s => {
        if(user.inventory.seeds[s] > 0) {
            hasAny = true;
            let div = document.createElement('div');
            div.className = `seed-icon ${selectedSeed === s ? 'active' : ''}`;
            div.innerHTML = `${s} <span style="position:absolute;bottom:-5px;right:-5px;background:var(--red);font-size:10px;padding:2px 5px;border-radius:5px;">${user.inventory.seeds[s]}</span>`;
            div.onclick = () => { selectedSeed = s; updateUI(); };
            bar.appendChild(div);
        }
    });
    if(!hasAny) bar.innerHTML = "<small style='width:100%;text-align:center;opacity:0.5'>Купи насіння у Шопі</small>";
}

function renderMap() {
    let g = document.getElementById('main-grid'); g.innerHTML = '';
    let isFarm = currentLoc === 'farm';
    let map = isFarm ? user.map_farm : user.map_mine;
    let maxSlots = isFarm ? user.slots_farm : user.slots_mine;
    for(let i=0; i < 20; i++) {
        let d = document.createElement('div');
        if(i < maxSlots) {
            let obj = map[i]; d.className = 'slot';
            if(!obj) { d.innerHTML = "+"; d.onclick = () => placeObject(i); }
            else {
                if(obj.type === 'plot') {
                    d.classList.add('item-plot');
                    if(obj.data) {
                        let left = Math.ceil((obj.data.finish - Date.now())/1000);
                        d.innerHTML = left <= 0 ? `<b style="font-size:40px; animation:pulse 1s infinite">${obj.data.emoji}</b>` : `🌱<br><small>${left}s</small>`;
                    } else d.innerHTML = "🟫";
                } else {
                    d.classList.add('item-stone');
                    let left = Math.ceil((obj.next - Date.now())/1000);
                    d.innerHTML = left <= 0 ? `💎` : `⏳`;
                }
                d.onclick = () => handleObject(i);
            }
        } else if(i === maxSlots) { d.className='slot locked'; d.innerHTML="🔒<br>"+(maxSlots*100); d.onclick=()=>buyLand(maxSlots*100); }
        else { d.className='slot locked'; d.innerHTML="🔒"; }
        g.appendChild(d);
    }
}

function handleObject(i) {
    let map = currentLoc === 'farm' ? user.map_farm : user.map_mine;
    let obj = map[i];
    if(obj.type === 'plot') {
        if(!obj.data) {
            if(!selectedSeed) return tg.showAlert("Вибери насіння знизу!");
            user.inventory.seeds[selectedSeed]--;
            obj.data = { emoji: selectedSeed, finish: Date.now() + (crops.find(x=>x.e===selectedSeed).t * 1000) };
            if(user.inventory.seeds[selectedSeed] === 0) selectedSeed = null;
        } else if(Date.now() >= obj.data.finish) {
            user.stats[obj.data.emoji] = (user.stats[obj.data.emoji] || 0) + 1;
            user.totalHarvests++; obj.data = null;
        }
    } else if(obj.type === 'stone' && Date.now() >= obj.next) {
        user.diamonds += 0.2; obj.next = Date.now() + 7200000;
        tg.showAlert("+0.2 💎");
    }
    save(); updateUI(); renderMap();
}

// Функції Скупщика
function renderDealer() {
    let h = ""; let empty = true;
    for(let e in user.stats) { 
        if(user.stats[e] > 0) { 
            let crop = crops.find(x => x.e === e); 
            h += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;animation:fadeIn 0.3s ease-out;">
                <span>${e} ${crop.n} x${user.stats[e]}<br><small style="color:var(--gold)">Ціна: ${crop.s}💰/шт</small></span>
                <button class="m-btn" style="width:auto;margin:0;background:var(--green);color:white;padding:5px 15px;" 
                onclick="openSell('${e}')">ПРОДАТИ</button>
            </div>`; 
            empty = false; 
        } 
    }
    document.getElementById('inventory-sell').innerHTML = empty ? "<center>Порожньо</center>" : h;
}

function openSell(emoji) {
    currentSellEmoji = emoji;
    let crop = crops.find(x => x.e === emoji);
    document.getElementById('sell-title').innerText = `ПРОДАТИ ${emoji}`;
    document.getElementById('sell-info').innerText = `У вас є ${user.stats[emoji]} шт. ${crop.n}`;
    document.getElementById('sell-input').value = Math.floor(user.stats[emoji] / 2);
    
    document.getElementById('sell-modal').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
    
    document.getElementById('confirm-sell-btn').onclick = () => {
        let amt = parseInt(document.getElementById('sell-input').value);
        if(amt > 0 && amt <= user.stats[emoji]) {
            let total = amt * crop.s;
            user.stats[emoji] -= amt;
            user.balance += total;
            tg.showAlert(`Успішно продано за ${total.toFixed(1)} 💰`);
            closeAllModals();
            save(); renderDealer(); updateUI();
        } else { tg.showAlert("Невірна кількість!"); }
    };
}

function sellAll() {
    let inc = 0;
    for(let e in user.stats) {
        let crop = crops.find(x => x.e === e);
        inc += user.stats[e] * crop.s;
        user.stats[e] = 0;
    }
    if(inc > 0) {
        user.balance += inc;
        tg.showAlert(`Все продано за ${inc.toFixed(1)} 💰`);
        save(); renderDealer(); updateUI();
    }
}

function closeAllModals() {
    document.getElementById('lvl-modal').style.display = 'none';
    document.getElementById('sell-modal').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
}

function openLvlModal() {
    let next = crops[user.unlockedIdx + 1];
    document.getElementById('lvl-task-desc').innerHTML = next ? `Зберіть ще ${next.req - user.totalHarvests} врожаїв, щоб відкрити ${next.e} ${next.n}` : "Ви досягли максимуму!";
    document.getElementById('lvl-modal').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
}

function show(s, b) {
    document.querySelectorAll('.screen').forEach(x => x.classList.remove('active-screen'));
    document.getElementById(s + '-screen').classList.add('active-screen');
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('seed-bar').style.display = (s === 'map') ? 'flex' : 'none';
    if(s === 'shop') renderShop();
    if(s === 'dealer') renderDealer();
}

// Інші системні функції
function switchLoc(loc) { currentLoc = loc; renderMap(); document.getElementById('tab-farm').className = loc === 'farm' ? 'tab-btn active' : 'tab-btn'; document.getElementById('tab-mine').className = loc === 'mine' ? 'tab-btn active' : 'tab-btn'; }
function save() { localStorage.setItem('agro_pro_v2', JSON.stringify(user)); }
function buyLand(cost) { if(user.balance >= cost) { user.balance -= cost; if(currentLoc==='farm') user.slots_farm++; else user.slots_mine++; save(); renderMap(); updateUI(); } }
function buyObject(id, cost) { if(user.balance >= cost) { user.balance -= cost; user.inventory[id]++; save(); updateUI(); } }
function buySeed(e, p) { if(user.balance >= p) { user.balance -= p; user.inventory.seeds[e] = (user.inventory.seeds[e]||0)+1; save(); updateUI(); } }
function renderShop() {
    let h = "";
    crops.forEach((c, idx) => {
        let locked = idx > user.unlockedIdx;
        h += `<div class="card" style="opacity:${locked?0.5:1}; display:flex; justify-content:space-between; align-items:center">
            <span>${locked?'🔒':c.e} ${c.n}<br><small>${c.p}💰</small></span>
            <button onclick="buySeed('${c.e}', ${c.p})" class="m-btn" style="width:auto;margin:0;" ${locked?'disabled':''}>КУПИТИ</button>
        </div>`;
    });
    document.getElementById('seed-list').innerHTML = h;
}
function checkQuests() {
    let next = crops[user.unlockedIdx + 1];
    if(next && user.totalHarvests >= next.req) { user.unlockedIdx++; user.level++; tg.showPopup({title:'Новий рівень!', message:'Ви відкрили '+next.n}); save(); }
}
</script>
</body>
    </html>
