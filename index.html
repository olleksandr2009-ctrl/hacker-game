<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>Brawl Farm: Pro Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #1a1a2e; --card: rgba(30, 30, 60, 0.9); --accent: #48dbfb;
            --gold: #f1c40f; --green: #2ecc71; --red: #e74c3c; --diamond: #00d2ff;
        }
        body {
            background: #1a1a2e; margin: 0; font-family: 'Segoe UI', sans-serif; color: white;
            overflow: hidden; user-select: none;
        }

        /* HEADER */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); padding: 10px 15px; border-bottom: 3px solid #d35400;
        }
        .currency { display: flex; gap: 15px; font-weight: bold; font-size: 14px; }
        .val-gold { color: var(--gold); }
        .val-dia { color: var(--diamond); }

        /* SCREENS */
        .screen { display: none; height: 80vh; padding: 15px; box-sizing: border-box; overflow-y: auto; text-align: center; }
        .active-screen { display: block; }

        /* ПРОФІЛЬ ТА КУКУРУДЗА */
        .char-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; border: 2px solid var(--gold); margin-top: 20px; }
        .corn-hero { font-size: 100px; position: relative; display: inline-block; }
        .corn-eyes { position: absolute; top: 35px; left: 25px; font-size: 25px; filter: grayscale(1) contrast(2); }

        /* МАГАЗИН */
        .shop-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
        .shop-item { 
            background: var(--card); border: 2px solid var(--diamond); border-radius: 15px; 
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
        }

        /* КАРТА */
        .map-box { background: #27ae60; height: 200px; border-radius: 20px; border: 5px solid #1e8449; display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; }

        /* КНОПКИ */
        .btn { background: var(--gold); color: black; border: none; padding: 12px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #d35400; }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d35400; }
        .btn-play { background: var(--red); color: white; box-shadow: 0 4px 0 #922b21; font-size: 20px; width: 100%; }

        /* FOOTER */
        .footer { position: fixed; bottom: 0; width: 100%; display: flex; background: #111; padding: 15px 0; border-top: 2px solid #333; }
        .nav-btn { flex: 1; background: none; border: none; color: #666; font-size: 11px; font-weight: bold; }
        .nav-btn.active { color: var(--gold); }
    </style>
</head>
<body onload="init()">

<div class="header">
    <div style="font-weight:bold">BRAWL FARM</div>
    <div class="currency">
        <div class="val-gold">💰 <span id="gold">0</span></div>
        <div class="val-dia">💎 <span id="diamonds">0</span></div>
    </div>
</div>

<div id="profile-screen" class="screen active-screen">
    <div class="char-box">
        <div class="corn-hero">
            🌽
            <div class="corn-eyes">😠</div>
        </div>
        <h3>Кукурудза-Месник</h3>
        <p>LVL: <span id="lvl">1</span> | HP: <span id="hp">100</span></p>
    </div>
    <br>
    <button class="btn" onclick="upgrade()">ПОКРАЩИТИ (100 💰)</button>
</div>

<div id="map-screen" class="screen">
    <div class="map-box" onclick="startBattle()">
        <h1 style="margin:0">🌲 ЛІС БОСІВ</h1>
        <p>Натисни, щоб почати бій</p>
    </div>
    <p style="color:#aaa; font-size:12px; margin-top:10px;">Вбивай босів, щоб отримати 💎 Алмази!</p>
</div>

<div id="shop-screen" class="screen">
    <h2>💎 МАГАЗИН АЛМАЗІВ</h2>
    <div class="shop-grid">
        <div class="shop-item">
            <div>
                <b>УЛЬТРА-СИЛА</b><br>
                <small>+20 до атаки</small>
            </div>
            <button class="btn" style="background:var(--diamond)" onclick="buySpecial(5)">5 💎</button>
        </div>
        <div class="shop-item">
            <div>
                <b>МЕГА-ЗАХИСТ</b><br>
                <small>+50 до HP</small>
            </div>
            <button class="btn" style="background:var(--diamond)" onclick="buySpecial(10)">10 💎</button>
        </div>
    </div>
</div>

<div class="footer">
    <button class="nav-btn active" onclick="show('profile', this)">ПРОФІЛЬ</button>
    <button class="nav-btn" onclick="show('map', this)">КАРТА</button>
    <button class="nav-btn" onclick="show('shop', this)">МАГАЗИН</button>
</div>

<script>
let tg = window.Telegram.WebApp;

let game = {
    gold: 2000000,
    diamonds: 0,
    lvl: 1,
    hp: 100,
    dmg: 1.0
};

function init() {
    updateUI();
}

function updateUI() {
    document.getElementById('gold').innerText = game.gold.toLocaleString();
    document.getElementById('diamonds').innerText = game.diamonds;
    document.getElementById('lvl').innerText = game.lvl;
    document.getElementById('hp').innerText = game.hp;
}

function show(s, btn) {
    document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active-screen'));
    document.getElementById(s + '-screen').classList.add('active-screen');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function upgrade() {
    if(game.gold >= 100) {
        game.gold -= 100;
        game.lvl++;
        game.hp += 5;
        updateUI();
        tg.showScanQrPopup({text: "LVL UP!"}); // Маленький ефект
        setTimeout(() => tg.closeScanQrPopup(), 500);
    }
}

function startBattle() {
    tg.showAlert("Бій починається! Вбивай боса 🌿");
    // Тимчасова логіка: ніби вбили боса
    setTimeout(() => {
        game.diamonds += 1;
        game.gold += 500;
        updateUI();
        tg.showAlert("ПЕРЕМОГА! Ти отримав 1 💎 та 500 💰");
    }, 2000);
}

function buySpecial(cost) {
    if(game.diamonds >= cost) {
        game.diamonds -= cost;
        game.dmg += 2;
        updateUI();
        tg.showAlert("Покращення куплено!");
    } else {
        tg.showAlert("Не вистачає алмазів! Вбивай босів на Карті.");
    }
}
</script>
</body>
    </html>
