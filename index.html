    <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Agro Tycoon Hardcore</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#48dbfb;--gold:#f1c40f;--green:#4cd137;--red:#e84118;--dirt:#5d4037;--stone:#7f8c8d;}
body{background:var(--bg);margin:0;font-family:sans-serif;color:white;overflow:hidden;user-select:none;}
.header{background:var(--card);padding:10px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.screen{display:none;height:80vh;overflow-y:auto;padding:15px;box-sizing:border-box;padding-bottom:120px;}
.active-screen{display:block;}
.stone-area{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:20px;}
.rock-container{text-align:center;}
.rock{width:130px;height:130px;background:var(--stone);border-radius:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 0 #34495e;position:relative;transition:0.1s;}
.rock.loading{opacity:0.5; filter: grayscale(1); transform: translateY(4px); box-shadow:none;}
.rock.locked{background:#2c3e50; border: 2px dashed var(--accent); box-shadow:none;}
.footer{position:fixed;bottom:0;width:100%;display:flex;background:var(--card);padding:10px 0;border-top:2px solid #0f3460;}
.nav-btn{flex:1;background:none;border:none;color:#95a5a6;display:flex;flex-direction:column;align-items:center;font-size:10px;}
.nav-btn.active{color:var(--accent);}
.m-btn{background:var(--gold);color:#1a1a2e;border:none;padding:10px;border-radius:8px;font-weight:bold;width:100%;}
.card{background:var(--card);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #0f3460;}
</style></head><body onload="init()">

<div class="header">
    <div style="color:var(--gold)">💰 <span id="balance">0.0</span></div>
    <div><b><span id="u-nick">Саша</span></b></div>
    <div style="color:var(--accent)">💎 <span id="diamonds">0.0</span></div>
</div>

<div id="stones-screen" class="screen active-screen">
    <h3 style="color:var(--accent);text-align:center;">⚒️ ШАХТА АЛМАЗІВ</h3>
    <div class="stone-area">
        <div class="rock-container">
            <div id="rock-small" class="rock"></div>
            <p id="timer-small" style="font-size:12px;color:var(--gold);margin-top:5px;"></p>
        </div>
        <div class="rock-container">
            <div id="rock-big" class="rock"></div>
            <p id="timer-big" style="font-size:12px;color:var(--gold);margin-top:5px;"></p>
        </div>
    </div>
    <div class="card" style="margin-top:20px;text-align:center;">
        <small>Курс: 1 💎 = 500 💰</small><br>
        <button class="m-btn" style="margin-top:5px;" onclick="exchange()">ОБМІНЯТИ 1 АЛМАЗ</button>
    </div>
</div>

<div id="farm-screen" class="screen"><div id="farm-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:15px;"></div></div>
<div id="shop-screen" class="screen"><h4 style="color:var(--accent)">🛒 МАГАЗИН</h4><div id="seed-list"></div></div>

<div class="footer">
    <button class="nav-btn" onclick="show('farm',this)">🚜 ФЕРМА</button>
    <button class="nav-btn active" onclick="show('stones',this)">⚒️ КАМІНЦІ</button>
    <button class="nav-btn" onclick="show('shop',this)">🛒 ШОП</button>
</div>

<script>
let tg = window.Telegram.WebApp;
let user = {
    balance: 500.0, diamonds: 5.0,
    smallStoneBought: false, bigStoneBought: false,
    smallStoneNext: 0, bigStoneNext: 0,
    hasBuff: false, inventory: {}, plots: [true, true, false, false], plotsData: [null,null,null,null]
};

function init() {
    let saved = localStorage.getItem('agro_hardcore');
    if(saved) user = JSON.parse(saved);
    updateUI();
    setInterval(updateTimers, 1000);
}

function updateUI() {
    document.getElementById('balance').innerText = user.balance.toFixed(1);
    document.getElementById('diamonds').innerText = user.diamonds.toFixed(1);
    renderStones();
}

function renderStones() {
    // Малий камінь
    let s = document.getElementById('rock-small');
    if(!user.smallStoneBought) {
        s.className = "rock locked"; s.innerHTML = "🪨<br><small>5 💎</small>";
        s.onclick = () => buyStone('small', 5);
    } else {
        let now = Date.now();
        if(now < user.smallStoneNext) {
            s.className = "rock loading"; s.innerHTML = "⏳"; s.onclick = null;
        } else {
            s.className = "rock"; s.innerHTML = "🪨<br><small>+0.3</small>";
            s.onclick = () => mine('small');
        }
    }

    // Великий камінь
    let b = document.getElementById('rock-big');
    if(!user.bigStoneBought) {
        b.className = "rock locked"; b.innerHTML = "💎<br><small>50 💎</small>";
        b.onclick = () => buyStone('big', 50);
    } else {
        let now = Date.now();
        if(now < user.bigStoneNext) {
            b.className = "rock loading"; b.innerHTML = "⏳"; b.onclick = null;
        } else {
            b.className = "rock"; b.innerHTML = "💎<br><small>+0.8</small>";
            b.onclick = () => mine('big');
        }
    }
}

function buyStone(type, cost) {
    if(user.diamonds >= cost) {
        user.diamonds -= cost;
        if(type === 'small') user.smallStoneBought = true;
        else user.bigStoneBought = true;
        save(); updateUI();
    } else { tg.showAlert("Недостатньо алмазів!"); }
}

function mine(type) {
    let bonus = user.hasBuff ? 0.3 : 0;
    if(type === 'small') {
        user.diamonds += (0.3 + bonus);
        user.smallStoneNext = Date.now() + (2 * 60 * 60 * 1000); // 2 години
    } else {
        user.diamonds += (0.8 + bonus);
        user.bigStoneNext = Date.now() + (4 * 60 * 60 * 1000); // 4 години
    }
    save(); updateUI();
}

function updateTimers() {
    let now = Date.now();
    if(user.smallStoneNext > now) {
        let diff = Math.ceil((user.smallStoneNext - now)/1000);
        document.getElementById('timer-small').innerText = "Готово через: " + formatTime(diff);
    } else { document.getElementById('timer-small').innerText = user.smallStoneBought ? "ГОТОВО" : ""; }

    if(user.bigStoneNext > now) {
        let diff = Math.ceil((user.bigStoneNext - now)/1000);
        document.getElementById('timer-big').innerText = "Готово через: " + formatTime(diff);
    } else { document.getElementById('timer-big').innerText = user.bigStoneBought ? "ГОТОВО" : ""; }
    
    // Оновлення грядок для візуалу (якщо відкрито екран ферми)
    if(document.getElementById('farm-screen').classList.contains('active-screen')) renderFarm();
}

function formatTime(sec) {
    let h = Math.floor(sec/3600); let m = Math.floor((sec%3600)/60); let s = sec%60;
    return `${h}г ${m}хв ${s}с`;
}

function exchange() {
    if(user.diamonds >= 1) { user.diamonds -= 1; user.balance += 500; save(); updateUI(); }
}

function save() { localStorage.setItem('agro_hardcore', JSON.stringify(user)); }

function show(s, b) {
    document.querySelectorAll('.screen').forEach(x => x.classList.remove('active-screen'));
    document.getElementById(s + '-screen').classList.add('active-screen');
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    b.classList.add('active');
}
</script></body></html>
