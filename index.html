<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>Brawl Farm: Constructor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #f1c40f; --blue: #3498db; --red: #e74c3c; }
        body { margin: 0; background: #1a1a2e; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: #27ae60; }
        
        /* Menu Screens */
        .screen { position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; flex-direction: column; align-items: center; z-index: 100; padding: 20px; text-align: center; }
        .hidden { display: none; }

        h1 { color: var(--accent); text-shadow: 2px 2px 0 #d35400; font-size: 40px; margin-bottom: 10px; }
        
        /* Brawler Card */
        .brawler-preview { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; border: 3px solid var(--accent); margin: 20px 0; width: 80%; }
        .big-emoji { font-size: 80px; margin: 10px 0; display: block; }
        
        .btn { background: var(--accent); color: black; padding: 15px 40px; border: none; border-radius: 15px; font-weight: bold; font-size: 20px; margin: 10px; cursor: pointer; box-shadow: 0 5px 0 #d35400; }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d35400; }
        .btn-blue { background: var(--blue); box-shadow: 0 5px 0 #2980b9; }

        /* Constructor */
        .input-group { margin: 15px 0; width: 100%; }
        input[type="range"] { width: 80%; }
        .emoji-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .emoji-item { font-size: 30px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; cursor: pointer; }
        .emoji-item.active { background: var(--accent); }

        /* In-game UI */
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; }
        .stats { padding: 10px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); }
        .hp-bar { width: 150px; height: 15px; background: #333; border: 2px solid white; border-radius: 10px; }
        #hp-fill { height: 100%; background: #2ecc71; width: 100%; transition: 0.2s; }
        
        .joystick-zone { position: fixed; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: all; }
        .stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: white; border-radius: 50%; opacity: 0.5; }
        .shoot-btn { position: fixed; bottom: 50px; right: 50px; width: 90px; height: 90px; background: var(--red); border-radius: 50%; border: 4px solid #c0392b; pointer-events: all; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 6px 0 #922b21; font-size: 18px; }
    </style>
</head>
<body>

<div id="menu-screen" class="screen">
    <h1>BRAWL FARM</h1>
    <div class="brawler-preview">
        <span id="p-emoji" class="big-emoji">🌽</span>
        <h2 id="p-name">КУКУРУДЗА</h2>
        <p>HP: <span id="p-hp-val">100</span> | Швидкість: <span id="p-spd-val">4</span></p>
    </div>
    <button class="btn" onclick="startGame()">У БІЙ!</button>
    <button class="btn btn-blue" onclick="openConstructor()">РЕДАКТОР</button>
</div>

<div id="constructor-screen" class="screen hidden">
    <h2>СТВОРИ БІЙЦЯ</h2>
    <div class="emoji-grid" id="emoji-list">
        </div>
    
    <div class="input-group">
        <label>Здоров'я (HP): <span id="c-hp-label">100</span></label><br>
        <input type="range" id="c-hp" min="50" max="200" value="100" oninput="updateStats()">
    </div>

    <div class="input-group">
        <label>Сила атаки: <span id="c-dmg-label">10</span></label><br>
        <input type="range" id="c-dmg" min="5" max="30" value="10" oninput="updateStats()">
    </div>

    <p style="font-size: 12px; color: #aaa;">Чим більше HP, тим менша швидкість бігу!</p>
    
    <button class="btn" onclick="saveBrawler()">ЗБЕРЕГТИ</button>
</div>

<div class="ui-layer">
    <div class="stats">
        <div><div class="hp-bar"><div id="hp-fill"></div></div></div>
        <div id="score-display">KILLS: 0</div>
    </div>
</div>

<div class="joystick-zone" id="joy-zone"><div class="stick" id="stick"></div></div>
<div class="shoot-btn" onclick="playerShoot()">HIT!</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let currentBrawler = {
    emoji: "🌽",
    name: "КУКУРУДЗА",
    hp: 100,
    speed: 4,
    dmg: 1
};

const availableEmojis = ["🌽", "🥕", "🍅", "🥦", "🍆", "🎃", "🌶️", "🥔"];
let tempEmoji = "🌽";

// Конструктор
function openConstructor() {
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('constructor-screen').classList.remove('hidden');
    
    const list = document.getElementById('emoji-list');
    list.innerHTML = "";
    availableEmojis.forEach(e => {
        let div = document.createElement('div');
        div.className = `emoji-item ${e === tempEmoji ? 'active' : ''}`;
        div.innerText = e;
        div.onclick = () => {
            tempEmoji = e;
            openConstructor(); // Refresh
        };
        list.appendChild(div);
    });
}

function updateStats() {
    let hp = document.getElementById('c-hp').value;
    let dmg = document.getElementById('c-dmg').value;
    document.getElementById('c-hp-label').innerText = hp;
    document.getElementById('c-dmg-label').innerText = dmg;
}

function saveBrawler() {
    currentBrawler.emoji = tempEmoji;
    currentBrawler.hp = parseInt(document.getElementById('c-hp').value);
    currentBrawler.dmg = parseInt(document.getElementById('c-dmg').value) / 10;
    // Баланс: чим більше HP, тим повільніше ходить
    currentBrawler.speed = Math.max(2, 6 - (currentBrawler.hp / 50));
    
    document.getElementById('p-emoji').innerText = currentBrawler.emoji;
    document.getElementById('p-hp-val').innerText = currentBrawler.hp;
    document.getElementById('p-spd-val').innerText = currentBrawler.speed.toFixed(1);
    
    document.getElementById('constructor-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

// ГРА
let player = { x: 0, y: 0, r: 22, hp: 100, maxHp: 100, score: 0 };
let bullets = [];
let enemies = [];
let gameActive = false;
let joy = { x: 0, y: 0, active: false };

function startGame() {
    document.getElementById('menu-screen').classList.add('hidden');
    player.x = canvas.width/2;
    player.y = canvas.height/2;
    player.hp = currentBrawler.hp;
    player.maxHp = currentBrawler.hp;
    player.score = 0;
    enemies = [];
    bullets = [];
    gameActive = true;
    spawnEnemy();
}

function spawnEnemy() {
    if(!gameActive) return;
    let side = Math.floor(Math.random() * 4);
    let x = (side%2==0) ? Math.random()*canvas.width : (side==1?canvas.width+20:-20);
    let y = (side%2!=0) ? Math.random()*canvas.height : (side==0?-20:canvas.height+20);
    enemies.push({ x, y, r: 18, hp: 2, speed: 1.5 + (player.score * 0.05) });
    setTimeout(spawnEnemy, Math.max(400, 1500 - player.score * 50));
}

function playerShoot() {
    if(!gameActive) return;
    let target = enemies[0];
    let angle = target ? Math.atan2(target.y - player.y, target.x - player.x) : -Math.PI/2;
    bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle)*10, vy: Math.sin(angle)*10 });
}

// Джойстик (спрощений)
const joyZone = document.getElementById('joy-zone');
joyZone.addEventListener('touchmove', e => {
    let rect = joyZone.getBoundingClientRect();
    let dx = e.touches[0].clientX - (rect.left + 60);
    let dy = e.touches[0].clientY - (rect.top + 60);
    let dist = Math.sqrt(dx*dx + dy*dy);
    joy.x = (dx/dist) * Math.min(1, dist/40);
    joy.y = (dy/dist) * Math.min(1, dist/40);
    document.getElementById('stick').style.transform = `translate(${joy.x*40}px, ${joy.y*40}px)`;
});
joyZone.addEventListener('touchend', () => {
    joy = {x:0, y:0};
    document.getElementById('stick').style.transform = `translate(0,0)`;
});

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!gameActive) { requestAnimationFrame(draw); return; }

    // Гравець
    player.x += joy.x * currentBrawler.speed;
    player.y += joy.y * currentBrawler.speed;
    ctx.font = "30px Arial";
    ctx.fillText(currentBrawler.emoji, player.x-15, player.y+10);

    // Кулі
    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        ctx.fillStyle = 'yellow';
        ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill();
        
        enemies.forEach((en, ei) => {
            if(Math.hypot(en.x-b.x, en.y-b.y) < en.r) {
                en.hp -= currentBrawler.dmg;
                bullets.splice(i, 1);
                if(en.hp <= 0) { enemies.splice(ei, 1); player.score++; }
            }
        });
    });

    // Вороги
    enemies.forEach((en, i) => {
        let a = Math.atan2(player.y-en.y, player.x-en.x);
        en.x += Math.cos(a)*en.speed; en.y += Math.sin(a)*en.speed;
        ctx.fillText("🌿", en.x-15, en.y+10);
        
        if(Math.hypot(en.x-player.x, en.y-player.y) < 30) {
            player.hp -= 0.5;
            document.getElementById('hp-fill').style.width = (player.hp/player.maxHp)*100 + "%";
            if(player.hp <= 0) {
                gameActive = false;
                document.getElementById('menu-screen').classList.remove('hidden');
                alert("Game Over! Kills: " + player.score);
            }
        }
    });

    document.getElementById('score-display').innerText = "KILLS: " + player.score;
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
            </html>
