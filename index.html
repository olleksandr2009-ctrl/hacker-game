<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>Mine Stars: Colored Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root{--bg:#0f0c29;--card:rgba(22, 33, 62, 0.9);--accent:#48dbfb;--gold:#f1c40f;--green:#2ecc71;--dirt:#3d2b1f;}
        body{background:linear-gradient(135deg, #0f0c29, #1a1a2e);margin:0;font-family:'Segoe UI',sans-serif;color:white;overflow:hidden;user-select:none;}

        .header{background:var(--card);padding:10px;border-bottom:2px solid var(--accent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
        .stats-line{display:flex;justify-content:space-between;align-items:center;font-size:14px;}
        
        .screen{display:none;height:78vh;overflow-y:auto;padding:15px;box-sizing:border-box;padding-bottom:120px;}
        .active-screen{display:block;animation:fadeIn 0.4s;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

        .farm-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
        .slot{height:140px;background:var(--dirt);border:3px solid #5d4037;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 0 #2a1d15;}

        /* Анімація */
        .star-growing { transition: 1s; opacity: 0.4; transform: scale(0.4); filter: blur(1px); }
        .star-ready { opacity: 1; transform: scale(1.1); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1.1); } 50% { transform: scale(1.2); } }

        /* Кошик (Вибір насіння) */
        #seed-selector{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:90%;background:var(--card);border:2px solid var(--accent);border-radius:20px;padding:15px;z-index:200;backdrop-filter:blur(15px);}
        .seed-option{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);padding:10px;border-radius:10px;margin-bottom:8px;}

        .m-btn{background:var(--gold);color:#1a1a2e;border:none;padding:12px;border-radius:10px;font-weight:bold;width:100%;margin-top:5px;cursor:pointer;}
        .footer{position:fixed;bottom:0;width:100%;display:flex;background:var(--card);padding:12px 0;border-top:2px solid #0f3460;z-index:100;}
        .nav-btn{flex:1;background:none;border:none;color:#95a5a6;display:flex;flex-direction:column;align-items:center;font-size:10px;}
        .nav-btn.active{color:var(--accent);}
        .card{background:var(--card);padding:15px;border-radius:15px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.1);}
        .price-tag{font-size:10px;background:rgba(0,0,0,0.3);padding:2px 5px;border-radius:5px;color:var(--gold);}
    </style>
</head>
<body onload="init()">

<div id="seed-selector">
    <h4 style="margin:0 0 10px 0; text-align:center">🧺 ОБЕРИ ЗІРКУ</h4>
    <div id="seed-list"></div>
    <button class="m-btn" style="background:var(--red);color:white" onclick="closeSeeds()">❌ ЗАКРИТИ</button>
</div>

<div class="header">
    <div class="stats-line">
        <div style="color:var(--gold)">⭐ <span id="balance">0.00</span></div>
        <div style="font-weight:bold;color:var(--accent)">MINE STARS PRO</div>
        <div style="font-size:11px">Lvl: <span id="lvl-badge">1</span></div>
    </div>
</div>

<div id="map-screen" class="screen active-screen">
    <div class="farm-grid" id="main-grid"></div>
</div>

<div id="shop-screen" class="screen">
    <div class="card">
        <h4 style="margin:0 0 10px 0;color:var(--accent)">📊 ПРАЙС-ЛИСТ ЗІРОК</h4>
        <div id="full-price-list"></div>
    </div>
    <div class="card">
        <h4 style="margin:0;color:var(--gold)">🛒 МАГАЗИН БАФІВ</h4>
        <button class="m-btn" style="background:#ff9800;color:white" onclick="sendToBot('buy_pickaxe')">⛏️ КИРКА (+20% доходу) (35 ⭐)</button>
        <button class="m-btn" style="background:var(--accent);color:black;margin-top:10px" onclick="sendToBot('buy_new_plot')">🌱 НОВА ГРЯДКА (25 ⭐)</button>
    </div>
</div>

<div id="dealer-screen" class="screen">
    <h3 style="color:var(--accent)">💰 ВИВІД</h3>
    <div class="card">Баланс: <b id="withdraw-bal">0.00</b> ⭐</div>
    <button class="m-btn" style="background:var(--green);color:white" onclick="sendToBot('withdraw_request')">ПОДАТИ ЗАЯВКУ</button>
</div>

<div class="footer">
    <button class="nav-btn active" onclick="show('map',this)">🚜 ФЕРМА</button>
    <button class="nav-btn" onclick="show('shop',this)">🛒 МАГАЗИН</button>
    <button class="nav-btn" onclick="show('dealer',this)">💳 ВИВІД</button>
</div>

<script>
let tg = window.Telegram.WebApp;
let selectedSlot = null;
let user = {
    balance: 0, level: 1, pickaxe: false,
    plots: 2, map: {} 
};

// ТВОЯ ЕКОНОМІКА З КОЛЬОРОВИМИ ЗІРКАМИ
const config = [
    {}, 
    {e:"⭐", n:"Жовта", s:0.01, t:1200, up:0.5, c:"gold"}, 
    {e:"💚", n:"Зелена", s:0.02, t:2400, up:1.5, c:"#2ecc71"}, 
    {e:"❤️", n:"Червона", s:0.03, t:5400, up:5.0, c:"#e74c3c"}, 
    {e:"💙", n:"Синя", s:0.04, t:10800, up:10.0, c:"#3498db"}, 
    {e:"💜", n:"Фіолетова", s:0.05, t:21600, up:25.0, c:"#9b59b6"}
];

function init() {
    let saved = localStorage.getItem('mine_stars_colored_v1');
    if(saved) user = JSON.parse(saved);
    updateUI(); renderMap(); renderPriceList();
    setInterval(() => { renderMap(); updateUI(); }, 1000);
}

function updateUI() {
    document.getElementById('balance').innerText = user.balance.toFixed(2);
    document.getElementById('withdraw-bal').innerText = user.balance.toFixed(2);
    document.getElementById('lvl-badge').innerText = user.level;
}

function renderMap() {
    let g = document.getElementById('main-grid'); g.innerHTML = '';
    for(let i=0; i < 10; i++) {
        let d = document.createElement('div');
        if(i < user.plots) {
            let obj = user.map[i] || {status:'empty'};
            d.className = 'slot';
            if(obj.status === 'empty') {
                d.innerHTML = "<span style='font-size:30px'>➕</span>";
                d.onclick = () => openSeeds(i);
            } else {
                let left = Math.ceil((obj.finish - Date.now())/1000);
                if(left <= 0) {
                    d.innerHTML = `<span class="star-ready" style="font-size:50px; color:${obj.color}">${obj.emoji}</span>`;
                    d.onclick = () => collect(i);
                } else {
                    let prog = 1 - (left / obj.totalTime);
                    d.innerHTML = `<span class="star-growing" style="font-size:50px; color:${obj.color}; transform:scale(${0.4+(prog*0.7)})">${obj.emoji}</span><br><small>${Math.floor(left/60)}m</small>`;
                }
            }
        } else { d.className = 'slot'; d.innerHTML = "🔒"; }
        g.appendChild(d);
    }
}

function openSeeds(i) {
    selectedSlot = i;
    let list = document.getElementById('seed-list'); list.innerHTML = '';
    // Можна садити тільки зірки свого рівня або нижче
    for(let i=1; i <= user.level; i++) {
        let s = config[i];
        list.innerHTML += `<div class="seed-option" onclick="startGrow(${i})">
            <span>${s.e} ${s.n}</span>
            <span class="price-tag">${Math.floor(s.t/60)} хв</span>
        </div>`;
    }
    document.getElementById('seed-selector').style.display = 'block';
}

function startGrow(lvlIdx) {
    let s = config[lvlIdx];
    user.map[selectedSlot] = { 
        status:'growing', emoji: s.e, color: s.c, 
        finish: Date.now() + (s.t * 1000), totalTime: s.t, reward: s.s 
    };
    closeSeeds(); save(); renderMap();
}

function collect(i) {
    let obj = user.map[i];
    let reward = obj.reward;
    if(user.pickaxe) reward *= 1.2;
    user.balance += reward;
    user.map[i] = {status:'empty'};
    tg.HapticFeedback.impactOccurred('success');
    save();
}

function renderPriceList() {
    let html = "";
    config.forEach((s, i) => {
        if(i === 0) return;
        html += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:12px; border-bottom:1px solid #333; padding:5px">
            <span>${s.e} ${s.n} (Lvl ${i})</span>
            <span>${s.s} ⭐ / ${Math.floor(s.t/60)} хв</span>
        </div>`;
    });
    document.getElementById('full-price-list').innerHTML = html;
}

function closeSeeds() { document.getElementById('seed-selector').style.display = 'none'; }
function sendToBot(a) { tg.sendData(a); }
function show(s, b) {
    document.querySelectorAll('.screen').forEach(x => x.classList.remove('active-screen'));
    document.getElementById(s + '-screen').classList.add('active-screen');
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    b.classList.add('active');
}
function save() { localStorage.setItem('mine_stars_colored_v1', JSON.stringify(user)); }
</script>
</body>
</html>
