<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D AgroCraft Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* Кнопки дій */
        .controls { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .btn { width: 60px; height: 60px; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; border-radius: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        
        /* Стіки джойстиків */
        .joy-zone { position: fixed; bottom: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 10; border: 1px solid rgba(255,255,255,0.3); }
        #move-joy { left: 20px; }
        #look-joy { right: 100px; bottom: 20px; display: none; } /* Ми використаємо свайпи замість другого джойстика для зручності */
        
        .stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: white; border-radius: 50%; opacity: 0.5; }
        
        #crosshair { position: fixed; top: 50%; left: 50%; width: 10px; height: 10px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
</head>
<body>

<div id="crosshair"></div>

<div class="joy-zone" id="move-joy">
    <div class="stick" id="move-stick"></div>
</div>

<div class="controls">
    <div class="btn" id="btn-break">ЛОМ</div>
    <div class="btn" id="btn-place">СТАВ</div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.AmbientLight(0xffffff, 1);
scene.add(light);

const geometry = new THREE.BoxGeometry(1, 1, 1);
const grassMat = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
const blocks = [];

function addBlock(x, y, z) {
    const mesh = new THREE.Mesh(geometry, grassMat);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    blocks.push(mesh);
}

for(let x = -5; x < 5; x++) {
    for(let z = -5; z < 5; z++) addBlock(x, 0, z);
}

// ЛОГІКА РУХУ (Джойстик)
let moveDir = { x: 0, z: 0 };
const moveJoy = document.getElementById('move-joy');
const moveStick = document.getElementById('move-stick');

moveJoy.addEventListener('touchmove', (e) => {
    e.preventDefault();
    let touch = e.touches[0];
    let rect = moveJoy.getBoundingClientRect();
    let x = touch.clientX - (rect.left + 60);
    let y = touch.clientY - (rect.top + 60);
    let dist = Math.sqrt(x*x + y*y);
    if(dist > 50) { x *= 50/dist; y *= 50/dist; }
    moveStick.style.transform = `translate(${x}px, ${y}px)`;
    moveDir.x = x/50; moveDir.z = y/50;
});

moveJoy.addEventListener('touchend', () => {
    moveStick.style.transform = `translate(0, 0)`;
    moveDir = { x: 0, z: 0 };
});

// ЛОГІКА ОГЛЯДУ (Свайпи по правій частині екрану)
let yaw = 0, pitch = 0;
window.addEventListener('touchmove', (e) => {
    if(e.touches[0].clientX > window.innerWidth / 2) {
        let touch = e.touches[0];
        if (window.lastTouch) {
            yaw -= (touch.clientX - window.lastTouch.clientX) * 0.005;
            pitch -= (touch.clientY - window.lastTouch.clientY) * 0.005;
            pitch = Math.max(-1.5, Math.min(1.5, pitch));
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        }
        window.lastTouch = { clientX: touch.clientX, clientY: touch.clientY };
    }
}, {passive: false});
window.addEventListener('touchend', () => window.lastTouch = null);

// ДІЇ (Ламати/Ставити)
const raycaster = new THREE.Raycaster();
const interact = (type) => {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects(blocks);
    if (intersects.length > 0) {
        const obj = intersects[0];
        if(type === 'break') {
            scene.remove(obj.object);
            blocks.splice(blocks.indexOf(obj.object), 1);
        } else {
            const p = obj.object.position.clone().add(obj.face.normal);
            addBlock(p.x, p.y, p.z);
        }
    }
};

document.getElementById('btn-break').onclick = () => interact('break');
document.getElementById('btn-place').onclick = () => interact('place');

camera.position.set(0, 1.6, 5);

function animate() {
    requestAnimationFrame(animate);
    camera.translateZ(moveDir.z * 0.1);
    camera.translateX(moveDir.x * 0.1);
    camera.position.y = 1.6;
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
