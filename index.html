<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Farm Stars Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Шапка з кнопкою Кошик */
        .header { 
            background: #161b22; padding: 15px; display: flex; 
            justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f1c40f; position: sticky; top: 0; z-index: 100;
        }
        
        .cart-btn {
            background: #f1c40f; color: black; border: none;
            padding: 8px 18px; border-radius: 20px; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }

        .container { padding: 20px; }
        .shop-title { color: #f1c40f; margin-bottom: 5px; }
        .shop-desc { color: #8b949e; font-size: 14px; margin-bottom: 20px; }

        /* Картки товарів */
        .shop-grid { display: flex; flex-direction: column; gap: 12px; }
        .item-card {
            background: #1c2128; border: 1px solid #30363d;
            border-radius: 12px; padding: 16px; display: flex;
            justify-content: space-between; align-items: center;
        }

        .item-info { text-align: left; }
        .item-name { display: block; font-weight: bold; color: #f1c40f; font-size: 17px; }
        .item-price { color: #8b949e; font-size: 13px; }

        .buy-btn {
            background: #238636; color: white; border: none;
            padding: 10px 20px; border-radius: 8px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        .buy-btn:active { transform: scale(0.95); background: #2ea043; }

        /* Нижня панель статусу */
        .footer-status {
            margin-top: 40px; padding: 25px;
            background: #161b22; border-radius: 20px 20px 0 0;
            border-top: 1px solid #30363d;
        }
        .status-label { color: #8b949e; font-size: 12px; letter-spacing: 1px; }
        .status-badge {
            display: inline-block; margin-top: 8px;
            padding: 6px 15px; border-radius: 15px;
            border: 1px solid #f1c40f; color: #f1c40f; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; font-size: 18px;">🚜 Farm Stars</div>
        <button class="cart-btn" onclick="openCart()">🎒 КОШИК</button>
    </div>

    <div class="container">
        <h2 class="shop-title">Магазин оновлень</h2>
        <p class="shop-desc">Купуй за Stars — отримуй на ферму!</p>
        
        <div class="shop-grid">
            <div class="item-card">
                <div class="item-info">
                    <span class="item-name">Залізна кирка ⛏️</span>
                    <span class="item-price">Ціна: 15 ⭐</span>
                </div>
                <button class="buy-btn" onclick="sendBuy('buy_pickaxe')">КУПИТИ</button>
            </div>

            <div class="item-card">
                <div class="item-info">
                    <span class="item-name">Нова грядка 🌱</span>
                    <span class="item-price">Ціна: 10 ⭐</span>
                </div>
                <button class="buy-btn" onclick="sendBuy('buy_plot')">КУПИТИ</button>
            </div>

            <div class="item-card">
                <div class="item-info">
                    <span class="item-name">Золота зірка 👑</span>
                    <span class="item-price">Ціна: 150 ⭐</span>
                </div>
                <button class="buy-btn" onclick="sendBuy('lvl_7')">КУПИТИ</button>
            </div>
        </div>
    </div>

    <div class="footer-status">
        <div class="status-label">ВАШ ПРОФІЛЬ</div>
        <div class="status-badge">АКТИВНИЙ ФЕРМЕР 🚜</div>
        <p style="font-size: 12px; color: #484f58; margin-top: 15px;">
            Всі зірки за покупки йдуть на розширення гри. Дякуємо!
        </p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Функція покупки через Telegram Stars
        function sendBuy(item) {
            tg.sendData(item); 
            tg.close(); // Закриваємо аппку, щоб вискочив рахунок у чаті
        }

        function openCart() {
            tg.showAlert("Ваш кошик наразі порожній або оновлюється!");
        }
    </script>
</body>
    </html>
