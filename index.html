<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Farm</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a2a1a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .farm-plot { background: #3d2b1f; border: 4px solid #5d4037; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .crop-icon { font-size: 50px; display: block; margin: 10px 0; }
        button { background: #4caf50; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .market-section { border-top: 2px dashed #4caf50; margin-top: 20px; padding-top: 20px; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <h1>МОЯ ФЕРМА 🌿</h1>
    
    <div class="farm-plot">
        <span class="crop-icon" id="crop">🟤</span>
        <div id="status">Грунт готовий до посадки</div>
        <button onclick="plant()">ПОСАДИТИ ПШЕНИЦЮ</button>
    </div>

    <div class="market-section">
        <h3>МАГАЗИН ВРОЖАЮ</h3>
        <p>Виставити зібране на продаж:</p>
        <input type="number" id="price" placeholder="Ціна в $">
        <button style="background: #ff9800;" onclick="sell()">ПРОДАТИ НА МАРКЕТІ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let isReady = false;

        function plant() {
            document.getElementById('crop').innerText = "🌱";
            document.getElementById('status').innerText = "Росте... (5 сек)";
            setTimeout(() => {
                document.getElementById('crop').innerText = "🌾";
                document.getElementById('status').innerText = "ВРОЖАЙ ГОТОВИЙ!";
                isReady = true;
            }, 5000);
        }

        function sell() {
            let price = document.getElementById('price').value;
            if (isReady && price > 0) {
                tg.sendData(JSON.stringify({
                    action: "farm_sell",
                    item: "Пшениця вищого сорту",
                    price: price
                }));
                tg.close();
            } else {
                alert("Спочатку вирости врожай!");
            }
        }
    </script>
</body>
</html>
