<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Agro Map Editor</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#48dbfb;--gold:#f1c40f;--green:#2ecc71;--dirt:#5d4037;--grass:#27ae60;}
body{background:var(--bg);margin:0;font-family:sans-serif;color:white;overflow:hidden;user-select:none;}
.header{background:var(--card);padding:10px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;font-size:12px;position:sticky;top:0;z-index:100;}
.screen{display:none;height:82vh;overflow-y:auto;padding:15px;box-sizing:border-box;padding-bottom:120px;}
.active-screen{display:block;}
/* КАРТА (ЗЕЛЕНА) */
.farm-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:10px;}
.slot{height:120px;background:var(--grass);border:3px solid #1e8449;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 0 #145a32;overflow:hidden;}
.slot.item-stone{background:#7f8c8d; border-color:#95a5a6;}
.slot.item-plot{background:var(--dirt); border-color:#3e2723;}
/* МЕНЮ ОБ'ЄКТІВ */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;z-index:200;align-items:center;justify-content:center;}
.modal-content{background:var(--card);padding:20px;border-radius:15px;width:80%;text-align:center;}
/* КНОПКИ */
.footer{position:fixed;bottom:0;width:100%;display:flex;background:var(--card);padding:10px 0;border-top:2px solid #0f3460;z-index:100;}
.nav-btn{flex:1;background:none;border:none;color:#95a5a6;display:flex;flex-direction:column;align-items:center;font-size:10px;}
.nav-btn.active{color:var(--accent);}
.m-btn{background:var(--gold);color:#1a1a2e;border:none;padding:10px;border-radius:8px;font-weight:bold;width:100%;margin-top:5px;}
.card{background:var(--card);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #0f3460;}
</style></head><body onload="init()">

<div class="header">
    <div style="color:var(--gold)">💰 <span id="balance">0.0</span></div>
    <div><b>МАПА</b></div>
    <div style="color:var(--accent)">💎 <span id="diamonds">0.0</span></div>
</div>

<div id="map-screen" class="screen active-screen">
    <div class="farm-grid" id="main-grid"></div>
</div>

<div id="shop-screen" class="screen">
    <div class="card">
        <h4 style="margin:0;color:var(--accent)">🪨 КУПИТИ КАМІНЦІ</h4>
        <div style="display:flex;gap:10px;margin-top:10px;">
            <button class="m-btn" onclick="buyObject('stone_small', 1000)">Малий (1к 💰)</button>
            <button class="m-btn" onclick="buyObject('stone_big', 5000)">Великий (5к 💰)</button>
        </div>
    </div>
    <div class="card">
        <h4 style="margin:0;color:var(--green)">🌱 КУПИТИ ГРЯДКУ</h4>
        <button class="m-btn" style="background:var(--green);color:white;" onclick="buyObject('plot', 500)">Грядка (500 💰)</button>
    </div>
    <h4 style="color:var(--accent)">🛒 НАСІННЯ</h4>
    <div id="seed-list"></div>
</div>

<div id="build-modal" class="modal">
    <div class="modal-content">
        <h3>Що встановити?</h3>
        <div id="build-options"></div>
        <button class="m-btn" style="background:var(--red);color:white;margin-top:15px;" onclick="closeModal()">СКАСУВАТИ</button>
    </div>
</div>

<div class="footer">
    <button class="nav-btn active" onclick="show('map',this)">🗾 КАРТА</button>
    <button class="nav-btn" onclick="show('shop',this)">🛒 ШОП</button>
</div>

<script>
let tg = window.Telegram.WebApp;
let selectedSlot = null;
let user = {
    balance: 2000.0, diamonds: 0.0,
    inventory: { stone_small: 0, stone_big: 0, plot: 1, seeds: {} },
    map: [ {type: 'plot', data: null}, null, null, null, null, null ], // 6 слотів на карті
    stats: {}
};

function init() {
    let saved = localStorage.getItem('agro_map_v1');
    if(saved) user = JSON.parse(saved);
    updateUI(); renderMap();
}

function updateUI() {
    document.getElementById('balance').innerText = user.balance.toFixed(0);
    document.getElementById('diamonds').innerText = user.diamonds.toFixed(1);
}

function renderMap() {
    let g = document.getElementById('main-grid'); g.innerHTML = '';
    user.map.forEach((obj, i) => {
        let d = document.createElement('div');
        d.className = 'slot';
        if(!obj) {
            d.innerHTML = "<span style='opacity:0.2;font-size:30px;'>+</span>";
            d.onclick = () => openBuild(i);
        } else {
            if(obj.type === 'plot') {
                d.classList.add('item-plot');
                if(obj.data) {
                    let left = Math.ceil((obj.data.finish - Date.now())/1000);
                    d.innerHTML = left <= 0 ? `<b>${obj.data.emoji}</b><br><small>ЗІБРАТИ</small>` : `🌱<br><small>${left}s</small>`;
                } else { d.innerHTML = "🟫<br><small>ПОРОЖНЬО</small>"; }
            } else {
                d.classList.add('item-stone');
                let isBig = obj.type === 'stone_big';
                let now = Date.now();
                if(obj.next && now < obj.next) {
                    let left = Math.ceil((obj.next - now)/1000);
                    d.innerHTML = `⏳<br><small>${Math.floor(left/60)}m</small>`;
                } else {
                    d.innerHTML = `${isBig?'💎':'🪨'}<br><small>КЛІК!</small>`;
                }
            }
            d.onclick = () => handleObject(i);
        }
        g.appendChild(d);
    });
}

function openBuild(i) {
    selectedSlot = i;
    let opt = document.getElementById('build-options'); opt.innerHTML = '';
    let items = [
        {id: 'plot', name: 'Грядка', emoji: '🟫'},
        {id: 'stone_small', name: 'М. камінь', emoji: '🪨'},
        {id: 'stone_big', name: 'В. камінь', emoji: '💎'}
    ];
    items.forEach(item => {
        if(user.inventory[item.id] > 0) {
            let b = document.createElement('button');
            b.className = 'm-btn';
            b.innerHTML = `${item.emoji} Встановити ${item.name} (${user.inventory[item.id]})`;
            b.onclick = () => placeObject(item.id);
            opt.appendChild(b);
        }
    });
    if(opt.innerHTML === '') opt.innerHTML = "<p>У вас нічого немає. Купіть у шопі!</p>";
    document.getElementById('build-modal').style.display = 'flex';
}

function placeObject(id) {
    user.inventory[id]--;
    user.map[selectedSlot] = { type: id, data: null, next: 0 };
    closeModal(); renderMap(); save();
}

function handleObject(i) {
    let obj = user.map[i];
    if(obj.type === 'plot') {
        if(!obj.data) {
            // Садимо насіння (логіка як раніше)
            let s = Object.keys(user.inventory.seeds).find(k => user.inventory.seeds[k] > 0);
            if(!s) return tg.showAlert("Купи насіння!");
            user.inventory.seeds[s]--;
            obj.data = { emoji: s, finish: Date.now() + 10000 }; // 10 сек для тесту
        } else if(Date.now() >= obj.data.finish) {
            user.stats[obj.data.emoji] = (user.stats[obj.data.emoji] || 0) + 1;
            obj.data = null;
            tg.showAlert("Зібрано!");
        }
    } else {
        // Логіка камінців
        if(Date.now() >= obj.next) {
            let isBig = obj.type === 'stone_big';
            user.diamonds += isBig ? 0.8 : 0.3;
            obj.next = Date.now() + (isBig ? 14400000 : 7200000); // 4 та 2 години
            updateUI();
        }
    }
    renderMap(); save();
}

function buyObject(id, cost) {
    if(user.balance >= cost) {
        user.balance -= cost;
        user.inventory[id]++;
        updateUI(); save();
        tg.showAlert("Куплено! Тепер постав його на карту.");
    } else { tg.showAlert("Мало монет!"); }
}

function show(s, b) {
    document.querySelectorAll('.screen').forEach(x => x.classList.remove('active-screen'));
    document.getElementById(s + '-screen').classList.add('active-screen');
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    b.classList.add('active');
    if(s === 'shop') renderShop();
}

function renderShop() {
    let h = "";
    [{e:"🌾", n:"Пшениця", p:10}].forEach(c => {
        h += `<div class="card" style="display:flex;justify-content:space-between;">
            <span>${c.e} ${c.n}</span>
            <button onclick="buySeed('${c.e}', ${c.p})" class="m-btn" style="width:auto;">${c.p}💰</button>
        </div>`;
    });
    document.getElementById('seed-list').innerHTML = h;
}

function buySeed(e, p) {
    if(user.balance >= p) {
        user.balance -= p;
        user.inventory.seeds[e] = (user.inventory.seeds[e]||0)+1;
        updateUI(); save();
    }
}

function closeModal() { document.getElementById('build-modal').style.display = 'none'; }
function save() { localStorage.setItem('agro_map_v1', JSON.stringify(user)); }
setInterval(renderMap, 1000); // Оновлення таймерів на карті
</script></body></html>
