<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hardcore Agro-Boy</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: sans-serif; touch-action: none; }
        canvas { display: block; background: linear-gradient(#1a2a6c, #b21f1f, #fdbb2d); }
        
        .ui { position: fixed; top: 10px; left: 10px; color: white; text-shadow: 2px 2px #000; font-size: 20px; }
        .controls { position: fixed; bottom: 20px; left: 20px; display: flex; gap: 15px; }
        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; user-select: none; }
        #btn-jump { position: fixed; bottom: 20px; right: 20px; width: 85px; height: 85px; background: rgba(255,255,0,0.4); }
    </style>
</head>
<body>

<div class="ui">Спроби: <span id="deaths">0</span></div>

<div class="controls">
    <div class="btn" id="btn-left">←</div>
    <div class="btn" id="btn-right">→</div>
</div>
<div class="btn" id="btn-jump">↑</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

let deaths = 0;
let player = { x: 50, y: 300, vx: 0, vy: 0, w: 30, h: 30, speed: 0.8, friction: 0.85, jump: -15, gravity: 0.8, onGround: false };
let keys = { left: false, right: false };

// Рівень: x, y, ширина, висота, тип (0 - блок, 1 - шипи, 2 - фініш)
const level = [
    {x: 0, y: 400, w: 200, h: 50, type: 0},
    {x: 250, y: 350, w: 100, h: 20, type: 0},
    {x: 400, y: 350, w: 150, h: 20, type: 1}, // ШИПИ
    {x: 600, y: 300, w: 100, h: 20, type: 0},
    {x: 750, y: 250, w: 100, h: 20, type: 0},
    {x: 900, y: 400, w: 200, h: 20, type: 1}, // ШИПИ
    {x: 1150, y: 350, w: 100, h: 20, type: 0},
    {x: 1300, y: 200, w: 50, h: 20, type: 2}, // ФІНІШ
];

// Керування
const setup = (id, k) => {
    const el = document.getElementById(id);
    el.ontouchstart = (e) => { e.preventDefault(); if(k) keys[k] = true; else if(player.onGround) player.vy = player.jump; };
    el.ontouchend = () => { if(k) keys[k] = false; };
};
setup('btn-left', 'left');
setup('btn-right', 'right');
setup('btn-jump', null);

function reset() {
    player.x = 50; player.y = 300; player.vx = 0; player.vy = 0;
    deaths++;
    document.getElementById('deaths').innerText = deaths;
}

function update() {
    if (keys.left) player.vx -= player.speed;
    if (keys.right) player.vx += player.speed;
    
    player.vx *= player.friction;
    player.vy += player.gravity;
    
    player.x += player.vx;
    player.y += player.vy;
    player.onGround = false;

    // Перевірка зіткнень
    level.forEach(p => {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y) {
            
            if (p.type === 1) reset(); // Смерть на шипах
            if (p.type === 2) { alert("ПЕРЕМОГА!"); reset(); deaths = 0; } // Фініш
            
            // Колізія зверху
            if (player.vy > 0 && player.y + player.h - player.vy <= p.y) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
            }
        }
    });

    if (player.y > H) reset(); // Впав у безодню
}

function draw() {
    update();
    ctx.clearRect(0, 0, W, H);

    // Камера за гравцем (тільки по X)
    let camX = player.x - W/4;
    ctx.save();
    ctx.translate(-camX, 0);

    level.forEach(p => {
        if (p.type === 0) ctx.fillStyle = "#fff";
        if (p.type === 1) ctx.fillStyle = "#ff4d4d"; // Шипи
        if (p.type === 2) ctx.fillStyle = "#00ff00"; // Фініш
        
        ctx.fillRect(p.x, p.y, p.w, p.h);
        
        // Малюємо "зуби" для шипів
        if (p.type === 1) {
            ctx.fillStyle = "#fff";
            for(let i=0; i<p.w; i+=10) {
                ctx.beginPath();
                ctx.moveTo(p.x + i, p.y);
                ctx.lineTo(p.x + i + 5, p.y - 10);
                ctx.lineTo(p.x + i + 10, p.y);
                ctx.fill();
            }
        }
    });

    // Гравець
    ctx.fillStyle = "#fdbb2d";
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(player.x, player.y, player.w, player.h);

    ctx.restore();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
